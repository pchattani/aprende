dialogues:
  - id: a1.u09.d1
    title: Domingo no Jardim Botânico
    context: Bia invites Tom to spend Sunday at the Botanical Garden. Tom wants to bring the three dogs.
    lines:
      - { speaker: Bia, es: "Tom, o que você vai fazer no domingo?", en: "Tom, what are you going to do on Sunday?" }
      - { speaker: Tom, es: "Ainda não sei. Por quê?", en: "I don't know yet. Why?" }
      - { speaker: Bia, es: "Eu vou ao Jardim Botânico de manhã. Quer ir comigo?", en: "I'm going to the Botanical Garden in the morning. Do you want to come with me?" }
      - { speaker: Tom, es: "Quero! Posso levar a Luna, o Leo e a Bonchita?", en: "Yes! Can I bring Luna, Leo and Bonchita?" }
      - { speaker: Bia, es: "Não pode. Cachorro não pode entrar no Jardim Botânico.", en: "You can't. Dogs aren't allowed in the Botanical Garden." }
      - { speaker: Tom, es: "Ah, não! E depois?", en: "Oh, no! And afterwards?" }
      - { speaker: Bia, es: "Depois vamos à praia. Lá eles podem brincar na areia.", en: "Afterwards we'll go to the beach. They can play in the sand there." }
      - { speaker: Tom, es: "Ótimo! Eu levo o guarda-sol e as toalhas.", en: "Great! I'll bring the beach umbrella and the towels." }
      - { speaker: Bia, es: "E eu faço sanduíches para o piquenique.", en: "And I'll make sandwiches for the picnic." }
      - { speaker: Tom, es: "Combinado! Vamos de ônibus?", en: "Deal! Shall we go by bus?" }
      - { speaker: Bia, es: "Vamos. O ônibus passa aqui às oito.", en: "Let's. The bus comes by here at eight." }
    questions:
      - { q: "Aonde a Bia vai no domingo de manhã?", options: ["À praia", "Ao Jardim Botânico", "Ao cinema"], answer: 1, explain: "Bia is going to the Botanical Garden on Sunday morning." }
      - { q: "Por que os cachorros não vão ao Jardim Botânico?", options: ["Porque estão cansados", "Porque não podem entrar", "Porque vão nadar"], answer: 1, explain: "Bia explains that dogs are not allowed in the Botanical Garden." }
      - { q: "O que o Tom vai levar?", options: ["Sanduíches", "O guarda-sol e as toalhas", "A bola"], answer: 1, explain: "Tom offers to bring the beach umbrella and the towels; Bia makes the sandwiches." }
      - { q: "Como eles vão?", options: ["A pé", "De metrô", "De ônibus"], answer: 2, explain: "They agree to take the bus, which comes by at eight." }
