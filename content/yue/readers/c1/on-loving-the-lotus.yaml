id: r.c1.on-loving-the-lotus
level: c1
title: 喺盧廉若公園讀〈愛蓮說〉
kind: literature
author: 周敦頤 Zhou Dunyi (1017–1073)
source: "周敦頤〈愛蓮說〉 (Song dynasty), quoted in full. Public domain. The tour-guide framing and the colloquial explanation are written for this course."
intro: "A Macau tour guide leads a group round the lotus pond of Lou Lim Ieoc Garden in summer and reads them a famous Song dynasty essay about the lotus, quoted in full in two parts. After each part she explains it in colloquial Cantonese, pointing out classical function words such as 之, 者, 也, 而, 焉 and 矣."
allow: [周敦頤, 愛蓮說, 陶淵明, 晉, 李唐, 宋朝, 唐朝, 盧廉若, 盧九, 何小姐]
paragraphs:
  - { es: "七月嘅澳門熱到攰，但係盧廉若公園入面，個荷花池開滿咗荷花，粉紅色、白色，一朵朵企喺水面。導遊何小姐帶住十幾個遊客行上九曲橋，叫大家停一停：「呢個花園原本係富商盧九嘅屋企人起嘅私人花園，跟足蘇州園林嘅設計，一九七四年先開放畀公眾。今日咁啱荷花開得最靚，我想讀一篇好出名嘅文章畀大家聽，就係宋朝周敦頤寫嘅〈愛蓮說〉。」", en: "Macau in July is exhaustingly hot, but in Lou Lim Ieoc Garden the lotus pond is in full bloom, pink and white flowers standing one by one above the water. The tour guide, Ms Ho, leads a dozen or so visitors onto the zigzag bridge and asks everyone to stop for a moment: 'This garden was originally a private garden built by the family of the wealthy merchant Lou Kau, designed entirely after the gardens of Suzhou, and it was only opened to the public in 1974. Today the lotuses happen to be at their most beautiful, so I'd like to read you a very famous essay: \"On Loving the Lotus\", by Zhou Dunyi of the Song dynasty.'" }
  - { es: "〈愛蓮說〉　周敦頤（上） ／ 水陸草木之花，可愛者甚蕃。晉陶淵明獨愛菊。自李唐來，世人甚愛牡丹。予獨愛蓮之出淤泥而不染，濯清漣而不妖，中通外直，不蔓不枝，香遠益清，亭亭淨植，可遠觀而不可褻玩焉。", en: "'On Loving the Lotus' – Zhou Dunyi (part one) / Of the flowers of plants and trees on water and land, very many are lovable. Tao Yuanming of the Jin loved only the chrysanthemum. Since the Tang of the Li family, people have loved the peony greatly. I alone love the lotus, which rises from the mud yet is not stained, is washed by clear ripples yet is not showy; hollow within and straight without, it neither sprawls nor branches; its fragrance grows purer the further it travels; it stands tall, slender and clean, to be admired from afar but not handled lightly." }
  - { es: "何小姐解釋：「水上面、陸地上面，可以愛嘅花多到數唔晒。晉朝嘅陶淵明淨係鍾意菊花；由唐朝開始，大家都好鍾意牡丹。『李唐』即係姓李嘅皇帝嘅唐朝。但係作者話：我就淨係鍾意蓮花。點解呢？因為佢由啲泥入面生出嚟，但係一啲都唔污糟；喺清水入面洗過，但係又唔妖艷。佢條莖中間係空心，外面好直，唔會周圍亂生，又唔會開枝。香味傳得越遠就越清，企得好直好乾淨，你可以遠遠欣賞，但係唔可以攞上手玩。」", en: "Ms Ho explains: 'On water and on land there are more lovable flowers than you can count. Tao Yuanming of the Jin dynasty liked only chrysanthemums; from the Tang dynasty on, everyone loved peonies. \"The Tang of Li\" means the Tang dynasty, whose emperors were surnamed Li. But the author says: I like only the lotus. Why? Because it grows out of the mud, yet it isn't dirty in the least; it's washed in clear water, yet it isn't gaudy. Its stem is hollow inside and straight outside; it doesn't grow wildly in all directions or put out branches. The further its scent travels, the purer it is; it stands upright and clean, and you can admire it from a distance, but you can't pick it up and play with it.'" }
  - { es: "有個由香港嚟嘅阿伯問：「咁長嘅句，點解讀落咁有節奏嘅？」何小姐話：「好問題。你聽吓：『出淤泥而不染，濯清漣而不妖』，兩句字數一樣，結構一樣，呢個叫對偶。跟住『中通外直，不蔓不枝』，四個字一組。古文好講究呢種平衡。仲有個『而』字，喺度即係『但係』，前後意思係相反嘅：由泥入面出嚟，『而』唔污糟。」", en: "A man from Hong Kong asks: 'Such long sentences – why do they sound so rhythmic?' Ms Ho says: 'Good question. Listen: \"rises from the mud yet is not stained, is washed by clear ripples yet is not showy\" – the two lines have the same number of characters and the same structure. That's called parallelism. Then \"hollow within, straight without; neither sprawling nor branching\" – groups of four characters. Classical prose cares a great deal about this kind of balance. And the word 而 here means \"but\": what comes before and after are opposites – it comes out of the mud, yet it isn't dirty.'" }
  - { es: "〈愛蓮說〉　周敦頤（下） ／ 予謂菊，花之隱逸者也；牡丹，花之富貴者也；蓮，花之君子者也。噫！菊之愛，陶後鮮有聞。蓮之愛，同予者何人？牡丹之愛，宜乎眾矣！", en: "'On Loving the Lotus' – Zhou Dunyi (part two) / I say the chrysanthemum is the recluse among flowers; the peony is the rich and noble one among flowers; the lotus is the gentleman among flowers. Ah! Of love for the chrysanthemum, little has been heard since Tao. Of love for the lotus, who shares it with me? Of love for the peony – naturally, it is shared by the many!" }
  - { es: "「作者將三種花比做三種人。菊花係隱士，即係唔想做官、走去鄉下隱居嘅人；牡丹係有錢有地位嘅人；蓮花就係君子。最後佢嘆氣話：唉，鍾意菊花嘅人，陶淵明之後好少聽到喇；鍾意蓮花嘅，有邊個同我一樣呢？至於鍾意牡丹嘅，梗係好多人啦！」何小姐笑住補充：「你哋聽唔聽得出佢有少少寸？意思係：大家都鍾意富貴，好少人肯好似蓮花噉，喺污糟嘅環境入面保持乾淨。」", en: "'The author compares the three flowers to three kinds of people. The chrysanthemum is the recluse, someone who doesn't want to be an official and goes off to live hidden in the countryside; the peony is the person with money and status; the lotus is the gentleman. At the end he sighs: alas, people who love chrysanthemums have been rarely heard of since Tao Yuanming; as for lotus lovers, who is like me? And peony lovers – of course there are lots of them!' Ms Ho adds with a smile: 'Can you hear that he's being a little sarcastic? He means: everyone loves wealth and rank, and very few are willing to be like the lotus, keeping clean in a dirty environment.'" }
  - { es: "「呢段文好多『之』、『者』、『也』。『花之隱逸者也』，『之』即係口語嘅『嘅』，『者』即係『嗰種』，『也』就係句尾，表示肯定，好似口語講『係……嚟㗎』。所以成句即係：『菊花係花入面隱士嗰種嚟㗎。』『鮮有聞』嘅『鮮』唔係新鮮嘅意思，要讀 sin2，即係『好少』。『宜乎眾矣』，就係『梗係多人啦』。」", en: "'This passage is full of 之, 者 and 也. In \"the recluse among flowers\", 之 is colloquial 嘅, 者 means \"that kind\", and 也 ends the sentence and makes it assertive, like colloquial 係……嚟㗎. So the whole line means: \"The chrysanthemum is the recluse kind among flowers.\" The 鮮 of \"little heard of\" doesn't mean fresh: you read it sin2, and it means \"rarely\". \"Naturally shared by the many\" is \"of course lots of people do!\"'" }
  - { es: "講完，何小姐指住池入面嘅荷花：「其實澳門同蓮花好有緣。澳門區旗上面就有一朵蓮花，好多人仲叫澳門做『蓮花寶地』。下次你哋見到區旗，可以諗起周敦頤講嘅：『出淤泥而不染』。」大家拎起手機影相，嗰個香港阿伯就喺度慢慢讀：「予獨愛蓮……」佢話：「我讀書嗰陣背過，背咗五十年都唔明，今日企喺荷花隔籬，終於明咗。」", en: "When she has finished, Ms Ho points at the lotuses in the pond: 'In fact Macau has a special connection with the lotus. There's a lotus on the flag of the Macau SAR, and many people call Macau \"the blessed land of the lotus\". Next time you see the flag, you can think of what Zhou Dunyi said: \"it rises from the mud yet is not stained\".' Everyone takes out their phones to take photos, and the man from Hong Kong reads slowly to himself: 'I alone love the lotus…' He says: 'I learned this by heart at school. I've known it for fifty years without understanding it, and today, standing next to the lotuses, I finally do.'" }
questions:
  - { q: "根據文章，作者點解特別鍾意蓮花？", options: ["因為蓮花好貴，代表富貴", "因為蓮花由泥入面生出嚟，但係好乾淨", "因為陶淵明都鍾意蓮花"], answer: 1, explain: "出淤泥而不染: it grows out of the mud without being stained – the image of integrity in a corrupt world." }
  - { q: "作者將牡丹比做邊種人？", options: ["隱士", "君子", "有錢有地位嘅人"], answer: 2, explain: "牡丹，花之富貴者也: the peony is the flower of wealth and rank." }
  - { q: "「出淤泥而不染」入面，「而」字表示乜嘢？", options: ["前後意思相反，即係「但係」", "時間先後，即係「跟住」", "原因，即係「因為」"], answer: 0, explain: "Here 而 links two contrasting ideas: rising out of mud, yet not stained." }
  - { q: "「陶後鮮有聞」嘅「鮮」係乜嘢意思？", options: ["新鮮", "好少", "好香"], answer: 1, explain: "Read sin2, 鮮 means 'rarely, few' – not sin1 'fresh'." }
  - { q: "點解何小姐話澳門同蓮花好有緣？", options: ["因為周敦頤喺澳門出世", "因為澳門區旗上面有蓮花", "因為盧廉若公園係澳門最大嘅公園"], answer: 1, explain: "The flag of the Macau SAR shows a lotus, and Macau is sometimes called 蓮花寶地." }
