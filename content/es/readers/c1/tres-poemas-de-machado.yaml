id: r.c1.tres-poemas-de-machado
level: c1
title: Tres poemas de Antonio Machado
kind: literature
author: Antonio Machado (1875–1939)
source: "«Recuerdo infantil» y «Anoche cuando dormía», de Soledades. Galerías. Otros poemas (1907); «Caminante, son tus huellas», de Proverbios y cantares (Campos de Castilla, 1912). Dominio público."
intro: "Three short poems by Antonio Machado, quoted in full; the lines of each poem are separated by a slash. The first paragraph is an editorial introduction written for this course, not Machado's text. Notice how the poet uses the imperfect, the subjunctive of hypothesis and repetition to shade meaning rather than state it."
allow: [machado, antonio, caín, abel, soledades, castilla, sevilla, soria, colliure, cantares, proverbios]
paragraphs:
  - { es: "Antonio Machado nació en Sevilla en 1875, fue profesor de francés en Soria y murió en Colliure, en Francia, en 1939, al final de la guerra civil. Sus poemas son breves y aparentan sencillez, pero cada palabra está elegida con cuidado: el que lea despacio descubrirá que un adjetivo o un tiempo verbal cambian el sentido de todo el poema.", en: "Antonio Machado was born in Seville in 1875, was a French teacher in Soria and died in Collioure, in France, in 1939, at the end of the civil war. His poems are short and appear simple, but every word is chosen with care: whoever reads slowly will discover that an adjective or a verb tense changes the meaning of the whole poem." }
  - { es: "RECUERDO INFANTIL. Una tarde parda y fría / de invierno. Los colegiales / estudian. Monotonía / de lluvia tras los cristales.", en: "CHILDHOOD MEMORY. A dull, cold afternoon / in winter. The schoolboys / are studying. Monotony / of rain behind the window panes." }
  - { es: "Es la clase. En un cartel / se representa a Caín / fugitivo, y muerto Abel, / junto a una mancha carmín.", en: "It is the classroom. On a poster / Cain is shown / fleeing, and Abel dead, / beside a crimson stain." }
  - { es: "Con timbre sonoro y hueco / truena el maestro, un anciano / mal vestido, enjuto y seco, / que lleva un libro en la mano.", en: "With a loud, hollow voice / the teacher thunders, an old man / badly dressed, gaunt and dry, / who carries a book in his hand." }
  - { es: "Y todo un coro infantil / va cantando la lección: / «mil veces ciento, cien mil; / mil veces mil, un millón».", en: "And a whole children's chorus / goes chanting the lesson: / 'a thousand times a hundred, a hundred thousand; / a thousand times a thousand, a million'." }
  - { es: "Una tarde parda y fría / de invierno. Los colegiales / estudian. Monotonía / de la lluvia en los cristales.", en: "A dull, cold afternoon / in winter. The schoolboys / are studying. Monotony / of the rain on the window panes." }
  - { es: "ANOCHE CUANDO DORMÍA. Anoche cuando dormía / soñé, ¡bendita ilusión!, / que una fontana fluía / dentro de mi corazón. / Di, ¿por qué acequia escondida, / agua, vienes hasta mí, / manantial de nueva vida / de donde nunca bebí?", en: "LAST NIGHT AS I SLEPT. Last night as I slept / I dreamt, blessed illusion!, / that a fountain was flowing / inside my heart. / Say, by what hidden channel, / water, do you come to me, / spring of new life / from which I never drank?" }
  - { es: "Anoche cuando dormía / soñé, ¡bendita ilusión!, / que una colmena tenía / dentro de mi corazón; / y las doradas abejas / iban fabricando en él, / con las amarguras viejas, / blanca cera y dulce miel.", en: "Last night as I slept / I dreamt, blessed illusion!, / that I had a beehive / inside my heart; / and the golden bees / were making in it, / out of the old bitternesses, / white wax and sweet honey." }
  - { es: "Anoche cuando dormía / soñé, ¡bendita ilusión!, / que un ardiente sol lucía / dentro de mi corazón. / Era ardiente porque daba / calores de rojo hogar, / y era sol porque alumbraba / y porque hacía llorar.", en: "Last night as I slept / I dreamt, blessed illusion!, / that a burning sun was shining / inside my heart. / It was burning because it gave / the warmth of a red hearth, / and it was a sun because it gave light / and because it made one weep." }
  - { es: "Anoche cuando dormía / soñé, ¡bendita ilusión!, / que era Dios lo que tenía / dentro de mi corazón.", en: "Last night as I slept / I dreamt, blessed illusion!, / that it was God that I had / inside my heart." }
  - { es: "CAMINANTE, SON TUS HUELLAS. Caminante, son tus huellas / el camino y nada más; / caminante, no hay camino, / se hace camino al andar. / Al andar se hace el camino, / y al volver la vista atrás / se ve la senda que nunca / se ha de volver a pisar. / Caminante, no hay camino, / sino estelas en la mar.", en: "WAYFARER, YOUR FOOTPRINTS. Wayfarer, your footprints / are the road, and nothing more; / wayfarer, there is no road, / the road is made by walking. / By walking the road is made, / and on looking back / one sees the path that never / will be trodden again. / Wayfarer, there is no road, / only wakes upon the sea." }
questions:
  - { q: "In «Recuerdo infantil», what creates the feeling of monotony?", options: ["The children playing in the rain", "The repetition of the first stanza at the end and the chanted multiplication table", "The teacher's jokes"], answer: 1 }
  - { q: "In «Anoche cuando dormía», the bees make honey out of what?", options: ["Flowers in the garden", "The poet's old bitternesses", "The water of the fountain"], answer: 1 }
  - { q: "Why does the poet call his dream a «bendita ilusión»?", options: ["Because the dream was pleasant but, being a dream, not real", "Because he won the lottery", "Because he was ill"], answer: 0 }
  - { q: "What does «se hace camino al andar» mean?", options: ["Roads are built by the government", "The path of a life exists only as it is walked; it is not given in advance", "Walking is good exercise"], answer: 1 }
