id: c1.u01
title: 口語同書面語
lessons:
  - id: c1.u01.l1
    title: 講嘅同寫嘅
    teach: [g.spoken-vs-written]
    vocab: [w.syu1-min6-jyu5, w.hau2-jyu5, w.man4-jin4, w.fong1-jin4, w.si6.b, w.dik1, w.taa1, w.taa1.b, w.taa1.c, w.ngo5-mun4, w.nei5-mun4, w.taa1-mun4, w.zoi6, w.ze2, w.ze2-go3, w.ze2-se1, w.naa5, w.naa5-go3, w.sam6-mo1, w.naa5-leoi5, w.zam2-mo1, w.wai6-sam6-mo1, w.hek3, w.hon3, w.syut3.b, w.kap1, w.dung1-sai1, w.han2, w.jaa5, w.wo4, w.gan1.b, w.daan6, w.ze2-leoi5, w.naa5-leoi5.b, w.seoi4, w.jat1-hei2, w.hou2-hek3, w.hak1-baak6, w.piu3-loeng6, w.loi4]
    tip: "Hong Kong and Macau speak Cantonese but write standard written Chinese, and read it aloud in Cantonese: 佢係 → 他是 (taa1 si6), 喺 → 在, 嘅 → 的, 乜嘢 → 甚麼."
    sentences:
      - { es: "他是我們的老師。", en: "He is our teacher.", altEs: ["佢係我哋嘅老師。"], altEn: ["He's our teacher."], grammar: [g.spoken-vs-written], vocab: [w.taa1, w.si6.b, w.ngo5-mun4, w.dik1], note: "Written Chinese, read aloud taa1 si6 ngo5 mun4 dik1 lou5 si1. Spoken: 佢係我哋嘅老師。", error: { wrong: "佢是我們的老師。", explain: "Don't mix registers: written 他是…的, spoken 佢係…嘅. 佢 never goes with 是.", grammar: g.spoken-vs-written } }
      - { es: "佢哋喺邊度？", en: "Where are they?", altEs: ["佢哋喺邊？"], grammar: [g.spoken-vs-written], vocab: [w.taa1-mun4, w.zoi6, w.naa5-leoi5], transform: { instruction: "Rewrite in written Chinese", answer: "他們在哪裏？", alt: ["她們在哪裏？"], en: "Where are they? (written)" } }
      - { es: "這些是甚麼東西？", en: "What are these things?", altEs: ["呢啲係乜嘢嚟㗎？", "呢啲係乜嘢？"], altEn: ["What are these?"], grammar: [g.spoken-vs-written], vocab: [w.ze2-se1, w.sam6-mo1, w.dung1-sai1] }
      - { es: "這裏是議事亭前地，那裏是郵政局。", en: "This is Senado Square, and that over there is the post office.", altEs: ["呢度係議事亭前地，嗰度係郵政局。"], grammar: [g.spoken-vs-written], vocab: [w.ze2-leoi5, w.naa5-leoi5.b, w.si6.b] }
      - { es: "你在看甚麼？", en: "What are you looking at?", altEs: ["你睇緊乜嘢？", "你正在看甚麼？"], altEn: ["What are you reading?"], grammar: [g.spoken-vs-written], vocab: [w.zoi6, w.hon3, w.sam6-mo1] }
      - { es: "我們和他們一起吃飯。", en: "We eat together with them.", altEs: ["我們跟他們一起吃飯。", "我哋同佢哋一齊食飯。"], altEn: ["We're eating with them."], grammar: [g.spoken-vs-written], vocab: [w.ngo5-mun4, w.wo4, w.taa1-mun4, w.jat1-hei2, w.hek3] }
      - { es: "她給我一本書。", en: "She gives me a book.", altEs: ["佢畀本書我。", "佢畀一本書我。"], altEn: ["She's giving me a book."], grammar: [g.spoken-vs-written], vocab: [w.taa1.b, w.kap1], note: "Word order changes too: written 給我一本書, spoken 畀本書我." }
      - { es: "那個人是誰？", en: "Who is that person?", altEs: ["嗰個係邊個？", "嗰個人係邊個？"], altEn: ["Who's that?"], grammar: [g.spoken-vs-written], vocab: [w.naa5-go3, w.seoi4] }
      - { es: "點去大三巴？", en: "How do you get to the Ruins of St Paul's?", altEs: ["大三巴點去？", "請問點去大三巴？"], grammar: [g.spoken-vs-written], vocab: [w.zam2-mo1], transform: { instruction: "Rewrite in written Chinese", answer: "怎麼去大三巴？", alt: ["請問怎麼去大三巴？"], en: "How do you get to the Ruins of St Paul's? (written)" } }
      - { es: "為甚麼你們也在這裏？", en: "Why are you all here too?", altEs: ["點解你哋都喺度？", "點解你哋都喺呢度？"], altEn: ["Why are you here as well?"], grammar: [g.spoken-vs-written], vocab: [w.wai6-sam6-mo1, w.nei5-mun4, w.jaa5, w.ze2-leoi5] }
      - { es: "這個很好吃，但很貴。", en: "This is delicious, but very expensive.", altEs: ["這個很好吃，但是很貴。"], altEn: ["This tastes great, but it's very expensive."], grammar: [g.spoken-vs-written], vocab: [w.ze2-go3, w.han2, w.hou2-hek3, w.daan6], transform: { instruction: "Say it in spoken Cantonese", answer: "呢個好好食，但係好貴。", alt: ["呢個好好食，不過好貴。", "呢樣嘢好好食，但係好貴。"], en: "This is delicious, but very expensive. (spoken)" } }
      - { es: "他說它很舊。", en: "He says it's very old.", altEs: ["她說它很舊。", "佢話佢好舊。"], altEn: ["She says it's very old."], grammar: [g.spoken-vs-written], vocab: [w.syut3.b, w.taa1.c, w.han2], note: "它 'it' exists only in writing; speech uses 佢 for people and things alike." }
      - { es: "喺香港同澳門，大家講口語，寫書面語。", en: "In Hong Kong and Macau, everyone speaks colloquially and writes in standard written Chinese.", altEs: ["喺香港同澳門，大家講嘅係口語，寫嘅係書面語。"], grammar: [g.spoken-vs-written], vocab: [w.hau2-jyu5, w.syu1-min6-jyu5] }
      - { es: "文言同書面語唔同，好難明。", en: "Classical Chinese isn't the same as written Chinese; it's hard to understand.", altEs: ["文言同書面語唔一樣，好難明。"], grammar: [g.spoken-vs-written], vocab: [w.man4-jin4, w.syu1-min6-jyu5] }
      - { es: "廣東話係一種方言，但係都有自己嘅字。", en: "Cantonese is a dialect, but it has its own characters too.", altEs: ["廣東話係一種方言，不過都有自己嘅字。"], grammar: [g.spoken-vs-written], vocab: [w.fong1-jin4] }
      - { es: "你可以跟我們一起去。", en: "You can go together with us.", altEs: ["你可以和我們一起去。", "你可以同我哋一齊去。"], altEn: ["You can come with us."], grammar: [g.spoken-vs-written], vocab: [w.gan1.b, w.ngo5-mun4, w.jat1-hei2] }
    exchanges:
      - q: { es: "「他們」用口語點講？", en: "How do you say 他們 in spoken Cantonese?" }
        a: { es: "口語講「佢哋」。", en: "In speech it's 佢哋." }
        alt: ["講「佢哋」。", "佢哋。"]
        grammar: [g.spoken-vs-written]
        vocab: [w.taa1-mun4, w.hau2-jyu5]
      - q: { es: "「甚麼」係乜嘢意思？", en: "What does 甚麼 mean?" }
        a: { es: "即係口語嘅「乜嘢」。", en: "It's the spoken 乜嘢, 'what'." }
        alt: ["即係「乜嘢」。", "同「乜嘢」一樣。"]
        grammar: [g.spoken-vs-written]
        vocab: [w.sam6-mo1]
      - q: { es: "張告示寫住乜嘢？", en: "What does the notice say?" }
        a: { es: "寫住「這裏不可以吃東西」，即係呢度唔可以食嘢。", en: "It says 'No eating here' — you can't eat here." }
        alt: ["唔可以喺度食嘢。", "即係呢度唔准食嘢。"]
        grammar: [g.spoken-vs-written]
        vocab: [w.ze2-leoi5, w.hek3, w.dung1-sai1]
      - q: { es: "點解報紙唔寫「佢」？", en: "Why don't newspapers write 佢?" }
        a: { es: "因為報紙用書面語，寫「他」或者「她」。", en: "Because newspapers use written Chinese, so they write 他 or 她." }
        alt: ["報紙用書面語。", "因為「佢」係口語。"]
        grammar: [g.spoken-vs-written]
        vocab: [w.syu1-min6-jyu5, w.taa1, w.taa1.b]
      - q: { es: "讀「他是我們的老師」，係咪要講普通話？", en: "To read 'he is our teacher' out loud, do you have to use Mandarin?" }
        a: { es: "唔使，用廣東話讀就得：taa1 si6 ngo5 mun4 dik1 lou5 si1。", en: "No, just read it in Cantonese: taa1 si6 ngo5 mun4 dik1 lou5 si1." }
        alt: ["唔使，用廣東話讀就得。", "唔係，廣東話都讀到。"]
        grammar: [g.spoken-vs-written]
        vocab: [w.taa1, w.si6.b, w.ngo5-mun4, w.dik1]
    texts:
      - title: "議事亭前地嘅告示"
        es: ["歡迎你們來到議事亭前地。", "這裏的黑白石頭路很漂亮。", "請小心自己的東西。"]
        en: ["Welcome to Senado Square.", "The black-and-white stone paving here is very beautiful.", "Please take care of your belongings."]
        grammar: [g.spoken-vs-written]
        vocab: [w.nei5-mun4, w.ze2-leoi5, w.dik1, w.han2, w.dung1-sai1]
      - title: "WhatsApp 訊息"
        es: ["我喺議事亭前地，啲告示全部係書面語。", "「這裏」即係「呢度」，「他們」即係「佢哋」。", "睇落好似普通話，但係用廣東話讀都得。"]
        en: ["I'm at Senado Square and the notices are all in written Chinese.", "這裏 means 呢度, 他們 means 佢哋.", "It looks like Mandarin, but you can read it in Cantonese too."]
        grammar: [g.spoken-vs-written]
        vocab: [w.syu1-min6-jyu5, w.ze2-leoi5, w.taa1-mun4]
    spicy:
      - { es: "他很好看，但他是我的。", en: "He's very good-looking, but he's mine.", altEs: ["她很好看，但她是我的。", "佢好靚仔，但係佢係我嘅。"], altEn: ["She's very good-looking, but she's mine."], grammar: [g.spoken-vs-written], vocab: [w.taa1, w.han2, w.daan6] }
      - { es: "你寫信畀我用書面語，係咪想扮斯文？", en: "You wrote me a letter in formal written Chinese — trying to look refined?", altEs: ["你用書面語寫信畀我，係咪想扮斯文？"], grammar: [g.spoken-vs-written], vocab: [w.syu1-min6-jyu5] }
      - { es: "你們在看甚麼？他是我的男朋友。", en: "What are you all looking at? He's my boyfriend.", altEs: ["你哋睇乜嘢？佢係我男朋友。", "你們看甚麼？他是我的男朋友。"], grammar: [g.spoken-vs-written], vocab: [w.nei5-mun4, w.hon3, w.sam6-mo1] }
      - { es: "「我很喜歡你」寫出嚟好斯文，講出嚟就要膽。", en: "'I like you very much' looks very proper written down; saying it out loud takes guts.", altEs: ["「我很喜歡你」寫出嚟好斯文，講出口就要膽。"], grammar: [g.spoken-vs-written], vocab: [w.han2, w.hei2-fun1] }
      - { es: "我同你講口語，你同我講真心話，好唔好？", en: "I'll talk to you in plain Cantonese and you tell me the truth, deal?", altEs: ["我同你講口語，你同我講真心話啦。"], grammar: [g.spoken-vs-written], vocab: [w.hau2-jyu5] }
  - id: c1.u01.l2
    title: 唔同不
    teach: [g.written-negation]
    vocab: [w.bat1.b, w.mut6-jau5, w.bat1-jiu3, w.bat1-jung6, w.bit6, w.soeng6-mei6, w.mou4, w.fei1.c, w.fau2, w.si6-fau2, w.nang4-fau2, w.soeng5-baan1, w.zok6-tin1, w.gam1-tin1, w.ming4-tin1, w.ho2, w.nang4, w.seoi1.b, w.jing1, w.jing1-dong1, w.koek3, w.jing4.c, w.zi2.b, w.waan4-mut6-jau5, w.kap1-jin1, w.mong4.b, w.liu5, w.ceot1-zik6, w.fei1-maai6-ban2, w.loi4, w.mat6.b, w.cing2-mat6, w.wui4]
    tip: "唔 → 不, 冇 → 沒有, 未 → 尚未 / 還沒有, 唔好 → 不要 / 別, 唔使 → 不用. 不 is never used for a finished past event: that is 沒有."
    sentences:
      - { es: "我不明白。", en: "I don't understand.", altEs: ["我唔明。", "我唔明白。"], grammar: [g.written-negation], vocab: [w.bat1.b], note: "Written; read ngo5 bat1 ming4 baak6." }
      - { es: "他昨天沒有上班。", en: "He didn't go to work yesterday.", altEs: ["她昨天沒有上班。", "佢尋日冇返工。"], altEn: ["She didn't go to work yesterday."], grammar: [g.written-negation], vocab: [w.taa1, w.zok6-tin1, w.mut6-jau5, w.soeng5-baan1], error: { wrong: "他昨天不上班。", explain: "A finished past event is negated with 沒有, not 不: 他昨天沒有上班.", grammar: g.written-negation } }
      - { es: "佢今日唔嚟。", en: "He isn't coming today.", altEs: ["佢今日唔會嚟。"], altEn: ["She isn't coming today."], grammar: [g.written-negation], vocab: [w.bat1.b, w.gam1-tin1], transform: { instruction: "Rewrite in written Chinese", answer: "他今天不來。", alt: ["她今天不來。", "他今天不會來。"], en: "He isn't coming today. (written)" } }
      - { es: "我們還沒有決定。", en: "We haven't decided yet.", altEs: ["我們尚未決定。", "我哋仲未決定。"], grammar: [g.written-negation], vocab: [w.waan4-mut6-jau5, w.soeng6-mei6] }
      - { es: "你不用擔心。", en: "You needn't worry.", altEs: ["你唔使擔心。"], altEn: ["You don't need to worry.", "Don't worry."], grammar: [g.written-negation], vocab: [w.bat1-jung6] }
      - { es: "請不要在這裏吸煙。", en: "Please do not smoke here.", altEs: ["請勿在這裏吸煙。", "唔該唔好喺度食煙。"], altEn: ["Please don't smoke here."], grammar: [g.written-negation], vocab: [w.bat1-jiu3] }
      - { es: "唔好喺議事亭前地踩單車。", en: "Don't ride bikes in Senado Square.", altEs: ["唔好喺議事亭前地踩車。"], altEn: ["No cycling in Senado Square."], grammar: [g.written-negation], vocab: [w.bat1-jiu3], transform: { instruction: "Rewrite as a written notice with 請不要", answer: "請不要在議事亭前地踩單車。", alt: ["請別在議事亭前地踩單車。"], en: "Please do not cycle in Senado Square. (written)" } }
      - { es: "別忘了明天的會議。", en: "Don't forget tomorrow's meeting.", altEs: ["不要忘了明天的會議。", "唔好唔記得聽日開會。"], grammar: [g.written-negation], vocab: [w.bit6, w.ming4-tin1] }
      - { es: "他不是學生，是老師。", en: "He isn't a student; he's a teacher.", altEs: ["他並不是學生，是老師。", "佢唔係學生，係老師。"], altEn: ["She's not a student, she's a teacher."], grammar: [g.written-negation], vocab: [w.bat1.b, w.si6.b] }
      - { es: "這裏沒有商店，只有住宅。", en: "There are no shops here, only homes.", altEs: ["呢度冇舖頭，淨係有住宅。"], grammar: [g.written-negation], vocab: [w.mut6-jau5, w.zi2.b, w.soeng1-dim3] }
      - { es: "請問你明天能否出席？", en: "May I ask whether you can attend tomorrow?", altEs: ["請問你明天是否能出席？", "請問你聽日嚟唔嚟到？"], grammar: [g.written-negation], vocab: [w.nang4-fau2, w.ming4-tin1] }
      - { es: "他是否同意，我們尚未知道。", en: "Whether he agrees, we don't know yet.", altEs: ["他同意與否，我們尚未知道。", "佢同唔同意，我哋仲未知。"], grammar: [g.written-negation], vocab: [w.si6-fau2, w.soeng6-mei6] }
      - { es: "學生須準時上課，不應遲到。", en: "Students must attend class on time and should not be late.", altEs: ["學生必須準時上課，不應遲到。", "學生要準時上堂，唔應該遲到。"], grammar: [g.written-negation], vocab: [w.seoi1.b, w.jing1, w.bat1.b] }
      - { es: "這個東西非賣品。", en: "This item is not for sale.", altEs: ["這件東西是非賣品。", "呢樣嘢唔賣嘅。"], grammar: [g.written-negation], vocab: [w.fei1.c, w.dung1-sai1], note: "非 'not' survives in fixed words: 非賣品 'not for sale', 非常 'extremely'." }
      - { es: "下了雨，路上卻仍然很多人。", en: "It rained, yet there were still lots of people in the streets.", altEs: ["下雨了，路上卻仍有很多人。", "落咗雨，但係街上仲係好多人。"], grammar: [g.written-negation, g.written-aspect], vocab: [w.koek3, w.jing4.c] }
      - { es: "冇問題，你可以入嚟。", en: "No problem, you can come in.", altEs: ["冇問題，入嚟啦。"], altEn: ["No problem, come in."], grammar: [g.written-negation], vocab: [w.mut6-jau5, w.ho2], transform: { instruction: "Rewrite in written Chinese", answer: "沒有問題，你可以進來。", alt: ["沒問題，你可以進來。", "沒有問題，你可進來。"], en: "No problem, you may come in. (written)" } }
    exchanges:
      - q: { es: "「佢冇嚟」寫出嚟點寫？", en: "How do you write 佢冇嚟?" }
        a: { es: "寫「他沒有來」。", en: "You write 他沒有來." }
        alt: ["他沒有來。", "寫「他沒來」。"]
        grammar: [g.written-negation]
        vocab: [w.mut6-jau5, w.taa1]
      - q: { es: "點解唔可以寫「他昨天不來」？", en: "Why can't you write 他昨天不來?" }
        a: { es: "因為係已經發生咗嘅事，要用「沒有」。", en: "Because it's something that already happened, so you need 沒有." }
        alt: ["過去嘅事要用「沒有」。", "要寫「他昨天沒有來」。"]
        grammar: [g.written-negation]
        vocab: [w.mut6-jau5, w.bat1.b, w.zok6-tin1]
      - q: { es: "張通告寫「明天不用上班」，即係點？", en: "The notice says 明天不用上班 — what does that mean?" }
        a: { es: "即係聽日唔使返工，好嘢！", en: "It means we don't have to go to work tomorrow — great!" }
        alt: ["聽日唔使返工。", "即係聽日放假。"]
        grammar: [g.written-negation]
        vocab: [w.bat1-jung6, w.ming4-tin1, w.soeng5-baan1]
      - q: { es: "份文件你睇完未呀？", en: "Have you finished reading the document?" }
        a: { es: "仲未，上面寫住「尚未完成」，即係未搞掂。", en: "Not yet — it says 尚未完成 at the top, meaning it isn't finished." }
        alt: ["仲未睇完。", "未呀，仲未搞掂。"]
        grammar: [g.written-negation]
        vocab: [w.soeng6-mei6]
      - q: { es: "「請勿吸煙」同「請不要吸煙」有冇分別？", en: "Is there any difference between 請勿吸煙 and 請不要吸煙?" }
        a: { es: "意思一樣，不過「勿」更加正式，多數喺告示見到。", en: "They mean the same, but 勿 is more formal and mostly seen on notices." }
        alt: ["意思一樣。", "冇乜分別，「勿」正式啲。"]
        grammar: [g.written-negation]
        vocab: [w.bat1-jiu3]
    texts:
      - title: "博物館告示"
        es: ["館內不可飲食。", "請不要觸摸展品。", "拍照時不可使用閃光燈。"]
        en: ["No eating or drinking inside the museum.", "Please do not touch the exhibits.", "Do not use flash when taking photos."]
        grammar: [g.written-negation]
        vocab: [w.bat1.b, w.ho2, w.bat1-jiu3]
      - title: "請假電郵"
        es: ["陳經理：", "我今天身體不適，未能上班。", "明天是否能回公司，我會再通知你。"]
        en: ["Manager Chan,", "I'm unwell today and am unable to come to work.", "I'll let you know whether I can come back to the office tomorrow."]
        grammar: [g.written-negation]
        vocab: [w.gam1-tin1, w.soeng5-baan1, w.si6-fau2, w.ming4-tin1]
    spicy:
      - { es: "我不是不喜歡你，只是還沒有準備好。", en: "It's not that I don't like you; I'm just not ready yet.", altEs: ["我唔係唔鍾意你，只係仲未準備好。"], grammar: [g.written-negation], vocab: [w.bat1.b, w.zi2.b, w.waan4-mut6-jau5] }
      - { es: "你昨天沒有回覆我，今天卻問我得唔得閒？", en: "You didn't reply to me yesterday, and today you ask if I'm free?", altEs: ["你尋日冇覆我，今日就問我得唔得閒？"], grammar: [g.written-negation], vocab: [w.zok6-tin1, w.mut6-jau5, w.gam1-tin1, w.koek3] }
      - { es: "請勿觸摸，除非你請我食飯。", en: "Please do not touch — unless you buy me dinner.", altEs: ["唔好掂，除非你請我食飯。"], grammar: [g.written-negation], vocab: [w.bat1-jiu3], jp: "cing2 mat6 zuk1 mo2 ceoi4 fei1 nei5 ceng2 ngo5 sik6 faan6" }
      - { es: "你不用擔心，我男朋友非常大方。", en: "No need to worry, my boyfriend is very easy-going.", altEs: ["你唔使擔心，我男朋友好大方。"], grammar: [g.written-negation], vocab: [w.bat1-jung6, w.fei1.c] }
      - { es: "你不應該咁靚仔，搞到我唔記得自己講到邊。", en: "You shouldn't be this handsome; I've forgotten where I was in my sentence.", altEs: ["你唔應該咁靚仔，搞到我唔記得講到邊。"], grammar: [g.written-negation], vocab: [w.jing1, w.bat1.b] }
  - id: c1.u01.l3
    title: 咗變成了
    teach: [g.written-aspect]
    vocab: [w.liu5, w.zoek6, w.zing3-zoi6, w.ji5, w.cang4.b, w.zoeng1.d, w.zoeng1-wui5, w.loi4, w.wui4, w.wui4-gaa1, w.haa6-jyu5, w.jin6-zoi6, w.haa6-ng5, w.mong4.b, w.cyun1.b, w.ji1-fuk6, w.seoi6-gaau3, w.hok6-zaap6, w.hei2-fun1, w.jyu1]
    tip: "V咗 → V了 (liu5), V緊 → 正在 V, V住 → V着, 過 stays 過. Sentence-final 喇 is also 了: 落雨喇 = 下雨了."
    sentences:
      - { es: "他已經回家了。", en: "He has gone home.", altEs: ["她已經回家了。", "佢已經返咗屋企。"], altEn: ["She's already gone home."], grammar: [g.written-aspect], vocab: [w.ji5-ging1, w.wui4-gaa1, w.liu5], note: "Read taa1 ji5 ging1 wui4 gaa1 liu5." }
      - { es: "我已經寄咗封信。", en: "I've already sent the letter.", altEs: ["我寄咗封信喇。"], grammar: [g.written-aspect], vocab: [w.liu5], transform: { instruction: "Rewrite in written Chinese", answer: "我已經寄了那封信。", alt: ["我已寄出那封信。", "我已經寄了信。"], en: "I have already sent the letter. (written)" } }
      - { es: "她正在打電話。", en: "She is on the phone.", altEs: ["他正在打電話。", "佢打緊電話。"], altEn: ["She's making a phone call."], grammar: [g.written-aspect], vocab: [w.zing3-zoi6] }
      - { es: "佢哋開緊會。", en: "They're in a meeting.", altEs: ["佢哋而家開緊會。"], grammar: [g.written-aspect], vocab: [w.zing3-zoi6], jp: "keoi5 dei6 hoi1 gan2 wui2", transform: { instruction: "Rewrite in written Chinese with 正在", answer: "他們正在開會。", alt: ["他們在開會。"], en: "They are in a meeting. (written)" } }
      - { es: "我們看過這部電影。", en: "We have seen this film.", altEs: ["我哋睇過呢套戲。"], altEn: ["We've watched this film."], grammar: [g.written-aspect], vocab: [w.ngo5-mun4, w.hon3], note: "過 is the same in both registers; the measure word changes (部 in writing, 套 in speech)." }
      - { es: "她穿着一件紅色的衣服。", en: "She is wearing a red top.", altEs: ["佢著住件紅衫。"], altEn: ["She's wearing red."], grammar: [g.written-aspect], vocab: [w.cyun1.b, w.zoek6, w.ji1-fuk6], jp: "taa1 cyun1 zoek6 jat1 gin6 hung4 sik1 dik1 ji1 fuk6" }
      - { es: "下雨了，帶把傘吧。", en: "It's raining; take an umbrella.", altEs: ["落雨喇，帶把遮啦。"], grammar: [g.written-aspect], vocab: [w.haa6-jyu5, w.liu5], note: "Final 了 = spoken 喇: 下雨了 = 落雨喇." }
      - { es: "他曾在澳門住過三年。", en: "He once lived in Macau for three years.", altEs: ["他曾經在澳門住過三年。", "佢以前喺澳門住過三年。"], altEn: ["She once lived in Macau for three years."], grammar: [g.written-aspect], vocab: [w.cang4.b] }
      - { es: "新的博物館將於明年開幕。", en: "The new museum will open next year.", altEs: ["新的博物館將會在明年開幕。", "新博物館出年開幕。"], grammar: [g.written-aspect], vocab: [w.zoeng1.d], note: "將 / 將會 mark the future in writing; speech just says 會 or nothing." }
      - { es: "明天將會下雨。", en: "It will rain tomorrow.", altEs: ["明天會下雨。", "聽日會落雨。"], grammar: [g.written-aspect], vocab: [w.zoeng1-wui5, w.haa6-jyu5] }
      - { es: "我忘了帶鎖匙。", en: "I forgot to bring my keys.", altEs: ["我忘記了帶鎖匙。", "我唔記得咗帶鎖匙。"], altEn: ["I've forgotten my keys."], grammar: [g.written-aspect], vocab: [w.mong4.b, w.liu5] }
      - { es: "他們已來到議事亭前地。", en: "They have arrived at Senado Square.", altEs: ["他們已經來到議事亭前地。", "佢哋已經嚟到議事亭前地。"], grammar: [g.written-aspect], vocab: [w.ji5, w.loi4] }
      - { es: "我現在正在學習書面語。", en: "I'm currently studying written Chinese.", altEs: ["我現在在學習書面語。", "我而家學緊書面語。"], grammar: [g.written-aspect], vocab: [w.jin6-zoi6, w.zing3-zoi6, w.hok6-zaap6] }
      - { es: "佢食咗飯。", en: "He has eaten.", altEs: ["佢食咗飯喇。"], altEn: ["She's eaten."], grammar: [g.written-aspect], vocab: [w.liu5], error: { wrong: "佢吃了飯。", explain: "Convert the whole sentence: written 他吃了飯, or spoken 佢食咗飯. Never 佢吃了.", grammar: g.written-aspect } }
      - { es: "下午三點我回公司。", en: "I'll go back to the office at three in the afternoon.", altEs: ["下午三點我會回公司。", "下晝三點我返公司。"], grammar: [g.written-aspect], vocab: [w.haa6-ng5, w.wui4] }
      - { es: "他很喜歡在飛機上睡覺。", en: "He really likes sleeping on planes.", altEs: ["佢好鍾意喺飛機上面瞓覺。"], altEn: ["She loves sleeping on planes."], grammar: [g.spoken-vs-written], vocab: [w.hei2-fun1, w.seoi6-gaau3] }
    exchanges:
      - q: { es: "「落雨喇」點寫？", en: "How do you write 落雨喇?" }
        a: { es: "寫「下雨了」。", en: "You write 下雨了." }
        alt: ["下雨了。", "寫「下雨了」，了讀 liu5。"]
        grammar: [g.written-aspect]
        vocab: [w.haa6-jyu5, w.liu5]
      - q: { es: "「了」用廣東話點讀？", en: "How is 了 read in Cantonese?" }
        a: { es: "讀書面語嗰陣讀 liu5。", en: "When reading written Chinese it's liu5." }
        alt: ["讀 liu5。", "liu5。"]
        grammar: [g.written-aspect]
        vocab: [w.liu5]
      - q: { es: "「佢攞住本書」寫出嚟點寫？", en: "How do you write 佢攞住本書?" }
        a: { es: "寫「他拿着一本書」。", en: "You write 他拿着一本書, 'he is holding a book'." }
        alt: ["他拿着一本書。", "她拿着一本書。"]
        grammar: [g.written-aspect]
        vocab: [w.zoek6]
      - q: { es: "博物館幾時開幕？", en: "When does the museum open?" }
        a: { es: "海報寫住「將於下月開幕」，即係下個月。", en: "The poster says 將於下月開幕 — so next month." }
        alt: ["下個月。", "下個月開幕。"]
        grammar: [g.written-aspect]
        vocab: [w.zoeng1.d]
    texts:
      - title: "旅行日記"
        es: ["今天我們來到了澳門。", "下午下了一場大雨，我們在咖啡店等了一個小時。", "晚上我們已經回到酒店了。"]
        en: ["Today we came to Macau.", "In the afternoon there was a heavy shower, and we waited an hour in a café.", "By the evening we were already back at the hotel."]
        grammar: [g.written-aspect]
        vocab: [w.loi4, w.liu5, w.haa6-ng5]
      - title: "同一句，兩種講法"
        es: ["口語：我而家學緊書面語。", "書面語：我現在正在學習書面語。", "意思一樣，但係用喺唔同嘅場合。"]
        en: ["Spoken: I'm studying written Chinese now.", "Written: I am currently studying written Chinese.", "Same meaning, but used on different occasions."]
        grammar: [g.written-aspect, g.spoken-vs-written]
        vocab: [w.jin6-zoi6, w.zing3-zoi6, w.hok6-zaap6]
    spicy:
      - { es: "我已經喜歡了你很久。", en: "I've liked you for a long time.", altEs: ["我鍾意咗你好耐。"], grammar: [g.written-aspect], vocab: [w.ji5-ging1, w.hei2-fun1, w.liu5] }
      - { es: "你今日著住呢件衫，我成日都專心唔到。", en: "With you wearing that top today, I haven't been able to concentrate all day.", altEs: ["你今日著呢件衫，我成日都專心唔到。"], grammar: [g.written-aspect], vocab: [w.zoek6] }
      - { es: "落雨喇，你冇帶遮？咁我哋一齊行啦。", en: "It's raining, and you didn't bring an umbrella? Then let's walk together.", altEs: ["落雨喇，你冇遮？咁一齊行啦。"], grammar: [g.written-aspect], vocab: [w.haa6-jyu5] }
      - { es: "我曾經以為自己唔會再心郁，直至見到你。", en: "I once thought I'd never fall for anyone again — until I saw you.", altEs: ["我以前以為自己唔會再心郁，直至見到你。"], grammar: [g.written-aspect], vocab: [w.cang4.b] }
  - id: c1.u01.l4
    title: 用廣東話讀出嚟
    teach: [g.spoken-vs-written, g.written-negation]
    vocab: [w.man4-baak6-ji6-duk6, w.man4-duk6, w.baak6-duk6, w.kwai1-faan6, w.zing3-zi6.b, w.ji6-tai2-zi6, w.faan4-tai2-zi6, w.gaan2-tai2-zi6, w.biu1-dim2-fu4-hou6, w.man4-faat3, w.jyu5-faat3, w.ci4-wui6, w.jyu5-ging2, w.coeng4-hap6, w.zing3-sik1, w.ceoi4-ji3, w.se2-zok3, w.long5-duk6, w.hau2-jam1, w.jyu5-tai2, w.zyun2-wun6, w.zing3-si6, w.nin4-hing1, w.piu3-loeng6, w.laang5, w.pin4-ji4, w.hou2-hon3, w.soeng1-dim3, w.leoi5, w.se2-faat3, w.zaau2, w.sang1-ming6, w.leoi5.b, w.gwong2-coeng4]
    tip: "Choose the register for the occasion: 書面語 for letters, notices and news, read aloud word by word in Cantonese; 口語 for conversation. Converting means changing words, word order and particles together."
    sentences:
      - { es: "寫正式嘅信要用書面語。", en: "A formal letter has to be written in standard written Chinese.", altEs: ["寫正式嘅信，要用書面語。"], grammar: [g.spoken-vs-written], vocab: [w.zing3-sik1, w.syu1-min6-jyu5] }
      - { es: "同朋友傾偈就隨意啲，講口語得喇。", en: "Chatting with friends is more casual; spoken Cantonese is fine.", altEs: ["同朋友傾偈隨意啲，講口語就得。"], grammar: [g.spoken-vs-written], vocab: [w.ceoi4-ji3, w.hau2-jyu5] }
      - { es: "唔同場合要用唔同嘅語體。", en: "Different occasions call for different registers.", altEs: ["唔同嘅場合要用唔同語體。"], grammar: [g.spoken-vs-written], vocab: [w.coeng4-hap6, w.jyu5-tai2] }
      - { es: "香港同澳門用繁體字，內地用簡體字。", en: "Hong Kong and Macau use traditional characters; the mainland uses simplified characters.", altEs: ["香港、澳門用繁體字，內地就用簡體字。"], grammar: [g.spoken-vs-written], vocab: [w.faan4-tai2-zi6, w.gaan2-tai2-zi6] }
      - { es: "老師叫我哋朗讀呢篇文章。", en: "The teacher asked us to read this article aloud.", altEs: ["老師叫我哋讀出呢篇文章。"], grammar: [g.spoken-vs-written], vocab: [w.long5-duk6] }
      - { es: "「生命」嘅生係文讀，「學生」嘅生係白讀。", en: "The 生 in 生命 is a literary reading; the 生 in 學生 is a colloquial reading.", altEs: ["「生命」個生係文讀，「學生」個生係白讀。"], grammar: [g.spoken-vs-written], vocab: [w.man4-duk6, w.baak6-duk6], jp: "sang1 ming6 ge3 saang1 hai6 man4 duk6 hok6 saang1 ge3 saang1 hai6 baak6 duk6", note: "生命 sang1 ming6 vs 學生 hok6 saang1: the word decides the reading." }
      - { es: "好多字都有文白異讀。", en: "Many characters have both a literary and a colloquial reading.", altEs: ["好多字都有文讀同白讀。"], grammar: [g.spoken-vs-written], vocab: [w.man4-baak6-ji6-duk6] }
      - { es: "呢句嘅文法冇錯，但係詞彙太口語化。", en: "The grammar of this sentence is fine, but the vocabulary is too colloquial.", altEs: ["呢句語法冇錯，但係詞彙太口語。"], grammar: [g.spoken-vs-written], vocab: [w.man4-faat3, w.ci4-wui6], jp: "ni1 geoi3 ge3 man4 faat3 mou5 co3 daan6 hai6 ci4 wui6 taai3 hau2 jyu5 faa3" }
      - { es: "書面語嘅語法同普通話差唔多。", en: "The grammar of written Chinese is close to Mandarin.", altEs: ["書面語嘅文法同普通話差唔多。"], grammar: [g.spoken-vs-written], vocab: [w.jyu5-faat3] }
      - { es: "這件衣服很漂亮，也很便宜。", en: "This piece of clothing is very pretty, and cheap too.", altEs: ["這件衣服很好看，也很便宜。", "呢件衫好靚，又好平。"], altEn: ["This top is very pretty and also cheap."], grammar: [g.spoken-vs-written], vocab: [w.piu3-loeng6, w.pin4-ji4, w.jaa5], transform: { instruction: "Say it in spoken Cantonese", answer: "呢件衫好靚，又好平。", alt: ["呢件衫好靚，仲好平。", "呢件衫好靚，都好平。"], en: "This top is really nice, and cheap too. (spoken)" }, error: { wrong: "這件衣服很漂亮，也好平。", explain: "Don't switch register mid-sentence: written 很漂亮 goes with 很便宜; in speech say 好靚，又好平.", grammar: g.spoken-vs-written } }
      - { es: "呢間舖頭啲嘢好平。", en: "The things in this shop are very cheap.", altEs: ["呢間舖頭嘅嘢好平。"], jp: "ni1 gaan1 pou3 tau2 di1 je5 hou2 peng4", grammar: [g.spoken-vs-written], vocab: [w.soeng1-dim3], transform: { instruction: "Rewrite in written Chinese", answer: "這間商店的東西很便宜。", alt: ["這家商店的東西很便宜。"], en: "The goods in this shop are very cheap. (written)" } }
      - { es: "今天很冷，很多年輕人仍然穿得很少。", en: "It's very cold today, yet many young people are still wearing very little.", altEs: ["今天很冷，很多年輕人卻穿得很少。", "今日好凍，好多後生仔仲係著得好少。"], grammar: [g.spoken-vs-written], vocab: [w.laang5, w.nin4-hing1] }
      - { es: "呢個字有兩個寫法，邊個先係正字？", en: "This character can be written two ways — which one is the standard form?", altEs: ["呢個字有兩種寫法，邊個係正字？"], grammar: [g.spoken-vs-written], vocab: [w.zing3-zi6.b, w.se2-faat3] }
      - { es: "「裏」同「裡」係異體字，意思一樣。", en: "裏 and 裡 are variant characters with the same meaning.", altEs: ["「裏」同「裡」係異體字，意思冇分別。"], grammar: [g.spoken-vs-written], vocab: [w.ji6-tai2-zi6, w.leoi5] }
      - { es: "寫作嘅時候，記得用全形標點符號。", en: "When writing, remember to use full-width punctuation marks.", altEs: ["寫作嗰陣，記得用全形標點符號。"], grammar: [g.spoken-vs-written], vocab: [w.se2-zok3, w.biu1-dim2-fu4-hou6] }
      - { es: "你嘅口音好正，完全唔似外國人。", en: "Your accent is spot on; you don't sound like a foreigner at all.", altEs: ["你口音好正，一啲都唔似外國人。"], grammar: [g.spoken-vs-written], vocab: [w.hau2-jam1], jp: "nei5 ge3 hau2 jam1 hou2 zeng3 jyun4 cyun4 m4 ci5 ngoi6 gwok3 jan4" }
    exchanges:
      - q: { es: "我想寫封信畀酒店投訴，用口語得唔得？", en: "I want to write a complaint letter to the hotel — can I use spoken Cantonese?" }
        a: { es: "最好用書面語，正式啲。", en: "Better to use written Chinese; it's more formal." }
        alt: ["用書面語好啲。", "唔好啦，正式嘅信用書面語。"]
        grammar: [g.spoken-vs-written]
        vocab: [w.syu1-min6-jyu5, w.zing3-sik1]
      - q: { es: "點樣將口語轉換做書面語？", en: "How do you convert spoken Cantonese into written Chinese?" }
        a: { es: "唔單止換字，連語序同助詞都要改。", en: "It's not just swapping words; you have to change the word order and the particles too." }
        alt: ["換字之外，語序都要改。", "成句一齊改，唔好淨係換幾個字。"]
        grammar: [g.spoken-vs-written]
        vocab: [w.zyun2-wun6]
      - q: { es: "「醫生」嘅生點讀？", en: "How is the 生 in 醫生 read?" }
        a: { es: "讀 sang1，係文讀；「學生」先讀 saang1。", en: "It's sang1, the literary reading; only in 學生 is it saang1." }
        alt: ["讀 sang1。", "文讀，sang1。"]
        grammar: [g.spoken-vs-written]
        vocab: [w.man4-duk6]
      - q: { es: "呢個講法啱唔啱？", en: "Is this way of saying it right?" }
        a: { es: "文法冇錯，不過要睇語境，喺呢度太正式喇。", en: "Grammatically it's fine, but it depends on context — here it's too formal." }
        alt: ["要睇語境。", "冇錯，不過太正式。"]
        grammar: [g.spoken-vs-written]
        vocab: [w.man4-faat3, w.jyu5-ging2, w.zing3-sik1]
      - q: { es: "正是你要找的那本書嗎？", en: "Is that precisely the book you're looking for?" }
        a: { es: "正是！我找了很久。", en: "That's the one! I've been looking for ages." }
        alt: ["係呀，正係呢本！", "正是這本。"]
        grammar: [g.spoken-vs-written, g.written-aspect]
        vocab: [w.zing3-si6, w.zaau2]
    texts:
      - title: "議事亭前地旅遊手冊"
        es: ["議事亭前地是澳門最有名的廣場之一。", "廣場的地面鋪滿黑白兩色的碎石。", "遊客可以在附近的商店買到很多手信。"]
        en: ["Senado Square is one of Macau's best-known squares.", "The ground of the square is paved with black and white stones.", "Visitors can buy plenty of souvenirs in the nearby shops."]
        grammar: [g.spoken-vs-written]
        vocab: [w.si6.b, w.dik1, w.soeng1-dim3]
      - title: "導遊用口語講"
        es: ["呢度就係議事亭前地，係澳門最出名嘅廣場之一。", "你哋睇吓地下，全部都係黑白色嘅碎石。", "附近有好多舖頭，可以買手信。"]
        en: ["This is Senado Square, one of Macau's most famous squares.", "Look at the ground — it's all black and white stones.", "There are lots of shops nearby where you can buy souvenirs."]
        grammar: [g.spoken-vs-written]
        vocab: [w.hau2-jyu5]
    spicy:
      - { es: "你嘅口音好正，再講多句我就投降。", en: "Your accent is gorgeous — one more sentence and I surrender.", altEs: ["你口音好正，再講多句我就投降喇。"], grammar: [g.spoken-vs-written], vocab: [w.hau2-jam1], jp: "nei5 ge3 hau2 jam1 hou2 zeng3 zoi3 gong2 do1 geoi3 ngo5 zau6 tau4 hong4" }
      - { es: "你可唔可以朗讀份菜單畀我聽？你把聲太好聽。", en: "Could you read the menu out loud for me? Your voice is too lovely.", altEs: ["你讀份菜單畀我聽好唔好？你把聲好好聽。"], grammar: [g.spoken-vs-written], vocab: [w.long5-duk6], jp: "nei5 ho2 m4 ho2 ji5 long5 duk6 fan6 coi3 daan1 bei2 ngo5 teng1 nei5 baa2 seng1 taai3 hou2 teng1" }
      - { es: "約會呢個場合，唔使咁正式，叫我名就得。", en: "A date isn't an occasion for formality; just call me by my name.", altEs: ["約會唔使咁正式，叫我個名得喇。"], grammar: [g.spoken-vs-written], vocab: [w.coeng4-hap6, w.zing3-sik1], jp: "joek3 wui6 ni1 go3 coeng4 hap6 m4 sai2 gam3 zing3 sik1 giu3 ngo5 meng2 zau6 dak1" }
      - { es: "書面語寫「你很漂亮」，口語講「你好靚」，我兩種都想講。", en: "Written Chinese says 你很漂亮, Cantonese says 你好靚 — I want to say both.", altEs: ["書面語係「你很漂亮」，口語係「你好靚」，兩種我都想講。"], grammar: [g.spoken-vs-written], vocab: [w.piu3-loeng6, w.syu1-min6-jyu5, w.hau2-jyu5] }
dialogues:
  - id: c1.u01.d1
    title: 議事亭前地嘅告示
    context: In Senado Square, Mandy, a Hong Kong student, helps her friend Sam read the notices and a museum leaflet, which are all in written Chinese.
    lines:
      - { speaker: Sam, es: "Mandy，張告示寫乜嘢？我識啲字，但係唔識讀。", en: "Mandy, what does this notice say? I know some of the characters but can't read it." }
      - { speaker: Mandy, es: "寫住「廣場內請勿踩單車」，即係呢度唔好踩單車。", en: "It says 'No cycling in the square' — you mustn't ride a bike here." }
      - { speaker: Sam, es: "點解唔寫「唔好」？", en: "Why don't they write 唔好?" }
      - { speaker: Mandy, es: "因為告示用書面語，唔用口語。不過我哋都係用廣東話讀出嚟。", en: "Because notices use written Chinese, not colloquial. But we still read it out in Cantonese." }
      - { speaker: Sam, es: "咁張單張呢？「本館逢星期一休息」。", en: "What about this leaflet? 本館逢星期一休息." }
      - { speaker: Mandy, es: "即係博物館逢星期一閂門。「本館」就係「呢間博物館」。", en: "It means the museum is closed on Mondays. 本館 just means 'this museum'." }
      - { speaker: Sam, es: "仲有下一句：「今天沒有導賞團。」", en: "And the next sentence: 今天沒有導賞團." }
      - { speaker: Mandy, es: "「沒有」即係「冇」，今日冇導賞團。", en: "沒有 means 冇 — there's no guided tour today." }
      - { speaker: Sam, es: "原來書面語同口語差咁遠！", en: "So written Chinese and spoken Cantonese are that different!" }
      - { speaker: Mandy, es: "係呀，不過多睇多讀，好快就習慣。", en: "Yes, but read and look at it a lot and you'll get used to it quickly." }
    questions:
      - { q: "「廣場內請勿踩單車」係乜嘢意思？", options: ["廣場入面唔好踩單車", "廣場入面可以租單車", "廣場入面唔好食嘢"], answer: 0, explain: "請勿 is the written 'please do not': no cycling in the square." }
      - { q: "博物館幾時閂門？", options: ["逢星期日", "逢星期一", "今日"], answer: 1, explain: "本館逢星期一休息: the museum closes every Monday." }
      - { q: "Mandy 話「沒有」即係乜嘢？", options: ["唔係", "未", "冇"], answer: 2, explain: "Written 沒有 corresponds to spoken 冇." }
      - { q: "告示用乜嘢語體寫？", options: ["口語", "書面語", "文言"], answer: 1, explain: "Mandy explains that notices are written in 書面語 but read aloud in Cantonese." }
writing:
  - task: "A friend from the Mainland left you this note in written Chinese. Rewrite it in colloquial Cantonese for your flatmate, and add your own reply."
    es: "我們明天下午三點在廣場見面。他說他還沒有吃午餐，所以我們會一起去吃東西。你也來嗎？"
    min: 90
    max: 160
    use: [w.syu1-min6-jyu5, w.hau2-jyu5, w.zyun2-wun6, w.gwong2-coeng4]
    useAtLeast: 2
    grammar: [g.spoken-vs-written, g.written-negation, g.written-aspect]
    expect:
      - { pattern: "我哋", hint: "In speech, 我們 becomes 我哋." }
      - { pattern: "佢", hint: "In speech, 他 becomes 佢." }
      - { pattern: "未|仲未", hint: "還沒有 becomes 仲未 in Cantonese." }
    model: { es: "張紙條用書面語寫，我幫你轉換做口語：「我哋聽日下晝三點喺廣場見面。佢話佢仲未食午餐，所以我哋會一齊去食嘢。你都嚟嗎？」我覆佢：好呀，我一定嚟，不過可能會遲十分鐘，你哋唔使等我先叫嘢食。如果有咩改變，記得打電話畀我。", en: "The note is in written Chinese, so I'll turn it into spoken Cantonese for you: \"We're meeting in the square at three tomorrow afternoon. He says he hasn't had lunch yet, so we'll go and eat together. Are you coming too?\" My reply: Sure, I'll definitely come, but I might be ten minutes late, so don't wait for me to order. If anything changes, remember to call me." }
  - task: "A shop near Senado Square has put up this notice in written Chinese. Explain what it means to your grandmother, who only reads spoken Cantonese comfortably."
    es: "本商店明天休息。請勿在商店內吸煙。這些都是非賣品，不要帶走。"
    min: 90
    max: 160
    use: [w.cing2-mat6, w.kap1-jin1, w.fei1-maai6-ban2, w.syu1-min6-jyu5]
    useAtLeast: 2
    grammar: [g.written-negation, g.spoken-vs-written]
    expect:
      - { pattern: "唔好|唔准|唔可以", hint: "請勿 and 不要 become 唔好 or 唔准 in speech." }
      - { pattern: "聽日", hint: "明天 becomes 聽日 in speech." }
    model: { es: "嫲嫲，呢張告示用書面語寫，意思係：間舖頭聽日休息，唔開門。喺舖頭入面唔准食煙。仲有，呢啲嘢係非賣品，即係唔賣嘅，唔好攞走。所以我哋今日買定啲嘢先，聽日就唔使再嚟喇。如果你睇唔明其他告示，隨時都可以問我。我陪你一齊去。", en: "Grandma, this notice is written in standard Chinese. It means: the shop is closed tomorrow. No smoking inside the shop. Also, these items are not for sale, so don't take them. So let's buy what we need today, then we won't need to come back tomorrow. If you can't understand other notices, you can always ask me. I'll go with you." }
  - task: "A beginner asks when to use spoken Cantonese and when to use written Chinese. Explain the difference, with examples of occasions."
    min: 90
    max: 160
    use: [w.syu1-min6-jyu5, w.hau2-jyu5, w.coeng4-hap6, w.zing3-sik1, w.ceoi4-ji3]
    useAtLeast: 3
    grammar: [g.spoken-vs-written]
    expect:
      - { pattern: "書面語", hint: "Mention written Chinese: 書面語." }
      - { pattern: "口語", hint: "Mention the spoken language: 口語." }
      - { pattern: "場合|正式|隨意", hint: "Say which occasions call for which: 正式場合…" }
    model: { es: "香港人講嘢用口語，但係寫正式文件嘅時候，一般都用書面語。例如寫信畀公司、寫報告或者考試寫文章，都要用書面語。不過同朋友傾偈、覆短訊或者喺網上留言，就可以隨意啲，直接寫口語。最緊要係睇場合，揀啱嘅語體。初學嘅時候，可以先學好口語，再慢慢學書面語。", en: "Hong Kongers speak in colloquial Cantonese, but for anything formal they usually write in standard written Chinese. For example, letters to companies, reports and exam essays all need written Chinese. But when chatting with friends, sending texts or posting comments online, you can be more casual and write colloquial Cantonese directly. The key is to look at the occasion and choose the right register. When you're starting out, you can learn spoken Cantonese well first, then gradually learn written Chinese." }
  - task: "Give your opinion: should Hong Kong schools also teach students to write colloquial Cantonese? Give reasons on both sides."
    min: 90
    max: 170
    use: [w.hau2-jyu5, w.syu1-min6-jyu5, w.se2-zok3, w.kwai1-faan6, w.jyu5-ging2]
    useAtLeast: 3
    grammar: [g.spoken-vs-written]
    expect:
      - { pattern: "我覺得|我認為|我個人", hint: "State your own view: 我覺得…" }
      - { pattern: "不過|但係|另一方面|雖然", hint: "Weigh the other side: 不過…, 另一方面…" }
    model: { es: "我個人覺得學校可以教學生寫口語，因為口語係我哋平時講嘅語言，識寫先可以準確咁表達自己。不過另一方面，書面語有清楚嘅規範，正式寫作同考試都要用。所以我認為兩樣都要學，最重要係學生明白喺唔同語境應該用邊種。", en: "Personally, I think schools could teach students to write colloquial Cantonese, because it's the language we speak every day, and being able to write it lets us express ourselves accurately. On the other hand, written Chinese has unified norms and is needed for formal writing and exams. So I believe both should be learned; what matters most is that students understand which to use in different contexts." }
