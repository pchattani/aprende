id: r.c1.la-cena-de-los-cumplidos
level: c1
title: La cena de los cumplidos
kind: dialogue
intro: A dinner among friends in Madrid, full of irony, indirect requests, downplayed compliments and the ritual refusals of Spanish politeness. Read for what people mean rather than what they say.
allow: [madrid, bilbao, raquel, nacho, elvira, mario]
paragraphs:
  - { es: "—¡Anda que no habéis tardado! —dijo Elvira abriendo la puerta—. Solo cuarenta minutos. Pasad, pasad, estáis en vuestra casa.", en: "'Well, you didn't take long!' said Elvira, opening the door. 'Only forty minutes. Come in, come in, make yourselves at home.'" }
  - { es: "—Perdona, es que Nacho ha querido traer vino del bueno y la tienda estaba cerrada —se excusó Raquel—. Hemos acabado en el supermercado de la esquina. Toma: no está mal para ser de supermercado.", en: "'Sorry, the thing is Nacho wanted to bring some decent wine and the shop was closed,' Raquel apologised. 'We ended up at the corner supermarket. Here: not bad for supermarket wine.'" }
  - { es: "—No hacía falta, mujer. Faltaría más. —Elvira miró la etiqueta y levantó una ceja—. ¡Vaya vino! ¿Y con qué dinero, si puede saberse? Ni que os hubiera tocado la lotería.", en: "'You shouldn't have. Not at all.' Elvira looked at the label and raised an eyebrow. 'What a wine! And with what money, if I may ask? As if you'd won the lottery.'" }
  - { es: "Mario salió de la cocina con un delantal que le quedaba pequeño. —¿Te importa si no te doy dos besos? Tengo las manos llenas de ajo. Oye, Raquel, una cosa: ¿no tendrás por casualidad el número del fontanero ese que os arregló el baño?", en: "Mario came out of the kitchen in an apron that was too small for him. 'Do you mind if I don't give you two kisses? My hands are covered in garlic. Hey, Raquel, one thing: you wouldn't by any chance have the number of that plumber who fixed your bathroom?'" }
  - { es: "—Te lo mando luego sin falta. ¿Qué os ha pasado? —Nada, que llevamos tres semanas duchándonos con agua fría. Mario dice que es sano. —Yo no he dicho que sea sano —protestó él—; he dicho que es temporal.", en: "'I'll send it to you later without fail. What's happened to you?' 'Nothing, just that we've been showering in cold water for three weeks. Mario says it's healthy.' 'I didn't say it's healthy,' he protested; 'I said it's temporary.'" }
  - { es: "Se sentaron. Elvira sirvió un plato enorme de croquetas. —No os cortéis, que hay más. —Yo con una tengo bastante —dijo Nacho, cogiendo tres—. Están buenísimas. ¿Las has hecho tú? —Bueno, son de mi madre; el mérito es suyo. Yo solo las he frito, y mal.", en: "They sat down. Elvira served an enormous plate of croquettes. 'Don't be shy, there are more.' 'One is enough for me,' said Nacho, taking three. 'They're delicious. Did you make them?' 'Well, they're my mother's; the credit is hers. I only fried them, and badly.'" }
  - { es: "—Hablando de madres —dijo Raquel—, la mía viene el sábado. Nos encantaría que vinierais a comer, pero… —Pero preferís que no —terminó Mario—. Tranquila, lo pillamos. —¡Qué va! Es que mi madre cocina para veinte y luego se ofende si no lo comemos todo. Lo digo por vosotros.", en: "'Speaking of mothers,' said Raquel, 'mine is coming on Saturday. We'd love you to come for lunch, but…' 'But you'd rather we didn't,' Mario finished. 'Don't worry, we get it.' 'Not at all! The thing is my mother cooks for twenty and then gets offended if we don't eat it all. I'm saying it for your sake.'" }
  - { es: "—Entonces vamos —dijo Elvira—, por solidaridad con vuestros estómagos. Por cierto, Nacho, ¿cómo va el trabajo nuevo? —Genial —contestó él con una sonrisa que no llegaba a los ojos—. Mi jefe es un encanto: solo me ha llamado tres veces este fin de semana. Lo que me faltaba.", en: "'Then we'll come,' said Elvira, 'out of solidarity with your stomachs. By the way, Nacho, how's the new job going?' 'Great,' he answered with a smile that didn't reach his eyes. 'My boss is a sweetheart: he's only called me three times this weekend. Just what I needed.'" }
  - { es: "—Con todo el respeto, Nacho —dijo Mario—, yo en tu lugar no cogería el teléfono. —Ya, y tú en mi lugar llevarías tres semanas sin agua caliente y lo llamarías «temporal». Elvira se levantó a por el postre para que nadie viera que se moría de risa.", en: "'With all due respect, Nacho,' said Mario, 'if I were you I wouldn't pick up the phone.' 'Right, and if you were me you'd have gone three weeks without hot water and call it \"temporary\".' Elvira got up to fetch dessert so that nobody would see she was dying of laughter." }
  - { es: "A las doce, Raquel miró el reloj. —Bueno, nosotros nos vamos yendo, que mañana madrugamos. —¿Ya? Si acabáis de llegar —dijo Elvira, y empezó a recoger los platos. Se despidieron en la puerta durante veinte minutos más; sin ánimo de ofender a nadie, así es como se despide la gente en Madrid.", en: "At twelve, Raquel looked at the clock. 'Well, we'll be getting along, we're up early tomorrow.' 'Already? You've only just arrived,' said Elvira, and began clearing the plates. They said goodbye at the door for another twenty minutes; no offence to anyone, but that is how people say goodbye in Madrid." }
questions:
  - { q: "How does Elvira greet the guests when they arrive forty minutes late?", options: ["With a direct complaint", "With an ironic remark about not taking long, then a welcome", "By refusing to let them in"], answer: 1 }
  - { q: "What does Mario really want when he says '¿no tendrás por casualidad el número del fontanero?'", options: ["To ask indirectly for the plumber's number", "To complain about the plumber", "To offer his own plumber"], answer: 0 }
  - { q: "How does Elvira respond to the compliment about the croquettes?", options: ["She accepts it proudly", "She plays it down and gives the credit to her mother", "She says they are from a shop"], answer: 1 }
  - { q: "Why does Raquel hesitate to invite them to lunch on Saturday?", options: ["She does not want to see them", "Her mother cooks too much and gets offended if it is not eaten", "She has no room at the table"], answer: 1 }
  - { q: "What does Nacho mean when he says his boss is 'un encanto' who 'only' called three times?", options: ["He genuinely likes his boss", "He is being sarcastic: the boss bothers him constantly", "He wants a new phone"], answer: 1 }
