id: r.b2.le-guide-avait-dit-qu-il-ferait-beau
level: b2
title: "Chamonix : le guide avait dit qu'il ferait beau"
kind: text
intro: Nadia tells the story of her attempt to climb Mont Blanc with a guide from Chamonix. Notice the sequence of tenses in reported speech (il m'avait dit qu'il ferait beau, il m'a demandé si j'avais déjà…).
allow: [nadia, balmat, paccard, saussure, horace-bénédict, gonella, goûter, ok, centre]
paragraphs:
  - { es: "Depuis l'âge de quinze ans, je rêvais de monter au sommet du mont Blanc. L'hiver dernier, j'ai enfin réservé une ascension avec un guide de la Compagnie des guides de Chamonix, fondée en 1821, la plus ancienne du monde. Au téléphone, Pierre, mon futur guide, m'a demandé si j'avais déjà fait de l'alpinisme. Je lui ai répondu que j'avais fait plusieurs randonnées en montagne, mais que je n'avais jamais utilisé de crampons. Il m'a dit que ce n'était pas grave, mais qu'il faudrait que je m'entraîne sérieusement pendant six mois.", en: "Since the age of fifteen I had dreamed of climbing to the top of Mont Blanc. Last winter I finally booked an ascent with a guide from the Compagnie des guides de Chamonix, founded in 1821, the oldest in the world. On the phone, Pierre, my future guide, asked me if I had done any mountaineering before. I told him I had done several mountain hikes, but that I had never used crampons. He said that it didn't matter, but that I would have to train seriously for six months." }
  - { es: "Je me suis entraînée tous les week-ends. En juillet, je suis arrivée à Chamonix, impressionnée par cette montagne blanche qui domine la vallée. Le soir, au café, Pierre m'a raconté l'histoire de la première ascension. Il m'a expliqué qu'en 1786, deux hommes de Chamonix, Jacques Balmat, un chercheur de cristaux, et Michel-Gabriel Paccard, un médecin, avaient atteint le sommet pour la première fois. Un savant de Genève, Horace-Bénédict de Saussure, avait promis une récompense à celui qui y arriverait le premier. Lui-même est monté l'année suivante, avec une vingtaine de porteurs.", en: "I trained every weekend. In July I arrived in Chamonix, impressed by that white mountain looming over the valley. In the evening, at the café, Pierre told me the story of the first ascent. He explained that in 1786 two men from Chamonix, Jacques Balmat, a crystal hunter, and Michel-Gabriel Paccard, a doctor, had reached the summit for the first time. A scientist from Geneva, Horace-Bénédict de Saussure, had promised a reward to whoever got there first. He himself climbed it the following year, with about twenty porters." }
  - { es: "Pierre avait consulté la météo. Il m'a assuré qu'il ferait beau pendant trois jours et que nous partirions le lendemain matin. Le premier jour, nous sommes montés jusqu'au refuge du Goûter, à plus de trois mille huit cents mètres. La vue était extraordinaire. Pierre m'a dit que nous nous lèverions à deux heures du matin et que nous devrions être au sommet avant neuf heures, avant que la neige ne devienne trop molle.", en: "Pierre had checked the weather forecast. He assured me it would be fine for three days and that we would leave the next morning. On the first day we climbed to the Goûter hut, at more than three thousand eight hundred metres. The view was extraordinary. Pierre told me that we would get up at two in the morning and that we should be at the summit before nine, before the snow got too soft." }
  - { es: "Mais cette nuit-là, je n'ai pas dormi. L'altitude me donnait mal à la tête, et le refuge était plein d'alpinistes qui ronflaient. À deux heures, quand Pierre m'a réveillée, le vent soufflait déjà fort. Nous sommes partis à la lumière de nos lampes frontales, attachés par une corde. Vers cinq heures, le ciel est devenu gris, puis il a commencé à neiger. Pierre s'est arrêté, a regardé le ciel longtemps, puis il m'a annoncé que nous allions faire demi-tour.", en: "But that night I didn't sleep. The altitude was giving me a headache, and the hut was full of snoring climbers. At two, when Pierre woke me, the wind was already blowing hard. We set off by the light of our head torches, roped together. Around five the sky turned grey, then it started to snow. Pierre stopped, looked at the sky for a long time, then told me we were going to turn back." }
  - { es: "J'étais furieuse. Je lui ai rappelé qu'il m'avait promis qu'il ferait beau ! Il m'a répondu calmement que la météo en montagne changeait vite, que le mont Blanc serait encore là l'année suivante, et qu'un bon guide était un guide qui ramenait ses clients vivants. Il m'a aussi rappelé que chaque été, des alpinistes mouraient sur cette montagne parce qu'ils avaient refusé de renoncer.", en: "I was furious. I reminded him that he had promised me the weather would be fine! He replied calmly that mountain weather changed quickly, that Mont Blanc would still be there the following year, and that a good guide was one who brought his clients back alive. He also reminded me that every summer climbers died on that mountain because they had refused to give up." }
  - { es: "En redescendant, nous sommes passés par la Mer de Glace, le plus grand glacier de France. Pierre m'a montré des panneaux qui indiquaient le niveau de la glace autrefois. Il m'a expliqué que le glacier avait perdu des dizaines de mètres d'épaisseur et que, pour l'atteindre depuis la gare du Montenvers, il fallait maintenant descendre plusieurs centaines de marches. Il m'a dit que, quand il était enfant, on y arrivait presque directement.", en: "On the way down we went past the Mer de Glace, the largest glacier in France. Pierre showed me signs showing where the ice used to be. He explained that the glacier had lost dozens of metres in thickness and that, to reach it from the Montenvers station, you now had to go down several hundred steps. He told me that when he was a child you could get to it almost directly." }
  - { es: "Je n'ai pas vu le sommet cette année-là. Mais Pierre m'a promis que nous réessaierions l'été prochain. Cette fois, je lui ai répondu que je le croirais quand je verrais le soleil.", en: "I didn't see the summit that year. But Pierre promised me we would try again next summer. This time I told him I'd believe it when I saw the sun." }
questions:
  - { q: "Qu'est-ce que le guide a demandé à Nadia au téléphone ?", options: ["Si elle avait déjà fait de l'alpinisme", "Si elle avait peur", "Combien elle voulait payer"], answer: 0, explain: "«Il m'a demandé si j'avais déjà fait de l'alpinisme.» Passé composé → plus-que-parfait in reported speech." }
  - { q: "Qui a atteint le sommet du mont Blanc pour la première fois ?", options: ["Horace-Bénédict de Saussure", "Jacques Balmat et Michel-Gabriel Paccard", "Pierre, le guide"], answer: 1, explain: "In 1786, «Jacques Balmat… et Michel-Gabriel Paccard». Saussure climbed it the following year." }
  - { q: "Pourquoi fallait-il être au sommet avant neuf heures ?", options: ["Parce que le refuge fermait", "Avant que la neige ne devienne trop molle", "Pour voir le lever du soleil"], answer: 1, explain: "«Avant que la neige ne devienne trop molle.»" }
  - { q: "Pourquoi Pierre a-t-il décidé de faire demi-tour ?", options: ["Nadia était trop fatiguée", "Le temps avait changé : vent et neige", "Il avait oublié la corde"], answer: 1, explain: "The sky turned grey and it started to snow; mountain weather changes fast." }
  - { q: "Qu'est-ce qui montre le recul de la Mer de Glace ?", options: ["Il faut descendre plusieurs centaines de marches pour l'atteindre", "On peut y skier toute l'année", "Le train ne monte plus au Montenvers"], answer: 0, explain: "«Pour l'atteindre depuis la gare du Montenvers, il fallait maintenant descendre plusieurs centaines de marches.»" }
  - { q: "« Il m'a assuré qu'il ferait beau. » Qu'est-ce que Pierre a dit exactement ?", options: ["« Il fait beau. »", "« Il fera beau. »", "« Il a fait beau. »"], answer: 1, explain: "Future in direct speech (il fera) becomes conditional (il ferait) after a past reporting verb." }
glossary:
  - { es: cristaux, en: crystals }
  - { es: porteurs, en: porters }
  - { es: consulté, en: "checked, consulted" }
  - { es: molle, en: soft }
  - { es: ronflaient, en: were snoring }
  - { es: "lampes frontales", en: head torches }
  - { es: frontales, en: "(lampe frontale = head torch)" }
  - { es: renoncer, en: to give up }
  - { es: redescendant, en: going back down }
  - { es: épaisseur, en: thickness }
  - { es: réessaierions, en: would try again }
