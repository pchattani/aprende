id: r.c2.quebec-je-me-souviens
level: c2
title: Québec, « Je me souviens »
kind: text
intro: "A reflective essay on Québec's motto, Je me souviens: where it comes from, what it might mean, and how memory shapes the city and its language. Notice the stylistic devices of a polished essay — rhetorical questions, ternary rhythm (une ville, une langue, une mémoire), concessions (certes… mais), and a conclusion that returns to the opening image."
allow: [militaires, slogan, mobiles, dufferin, québec, québécois, québécoise, québécoises, champlain, samuel, montcalm, wolfe, abraham, frontenac, taché, eugène-étienne, saint-laurent, canada, canadien, canadiens, mexique, unesco, amérique, nouvelle-france, lys, britanniques, britannique, anglophone, anglophones, francophones, francophone, ottawa, montréal]
paragraphs:
  - { es: "Il suffit de passer quelques heures à Québec pour la remarquer partout : sur les plaques d'immatriculation des voitures, sur les bâtiments officiels, sur les souvenirs vendus aux touristes. Trois mots, d'une sobriété presque déroutante : « Je me souviens ». Une devise sans complément, comme une phrase interrompue. Mais de quoi, au juste, les Québécois se souviennent-ils ?", en: "You only need to spend a few hours in Québec City to notice it everywhere: on car number plates, on official buildings, on the souvenirs sold to tourists. Three words, of an almost disconcerting sobriety: 'Je me souviens' (I remember). A motto without an object, like an interrupted sentence. But what, exactly, do the people of Québec remember?" }
  - { es: "L'histoire de la devise, elle, est connue. En 1883, l'architecte Eugène-Étienne Taché la fit graver au-dessus de la porte principale de l'hôtel du Parlement, qu'il venait de dessiner. Sur la façade, il avait prévu des statues de grands personnages de l'histoire du pays, découvreurs, missionnaires, militaires, comme pour inviter les passants à ne pas oublier ceux qui avaient fondé la Nouvelle-France. Ce n'est qu'en 1978 que la devise remplaça, sur les plaques des voitures, l'ancien slogan « La belle province ». Ce simple changement disait déjà beaucoup : on passait d'une carte postale à une affirmation.", en: "The history of the motto, at least, is well known. In 1883 the architect Eugène-Étienne Taché had it carved above the main door of the Parliament building he had just designed. On the façade he had planned statues of great figures from the country's history — explorers, missionaries, soldiers — as if to invite passers-by not to forget those who had founded New France. It was only in 1978 that the motto replaced the old slogan 'La belle province' on car number plates. That simple change already said a great deal: it was a move from a postcard to an assertion." }
  - { es: "Quant à son sens, Taché ne l'a jamais vraiment expliqué, et ce silence a laissé la place à toutes les interprétations. On a parfois prétendu que la devise était la première ligne d'un texte plus long, qui évoquait à la fois la France et l'Angleterre ; mais cette version est contestée par les historiens. Pour certains, il s'agit de la mémoire de la défaite de 1759, lorsque les troupes britanniques du général Wolfe battirent celles de Montcalm sur les plaines d'Abraham, aux portes de la ville. Les deux généraux y perdirent la vie, et quatre ans plus tard, la Nouvelle-France fut cédée à la Grande-Bretagne. Pour d'autres, la devise est moins un regret qu'une fidélité : celle d'un peuple qui, coupé de la France, a gardé sa langue, sa religion pendant longtemps, et ses institutions.", en: "As for its meaning, Taché never really explained it, and that silence has left room for every interpretation. It has sometimes been claimed that the motto was the first line of a longer text that evoked both France and England; but historians dispute this version. For some, it is the memory of the defeat of 1759, when General Wolfe's British troops beat Montcalm's on the Plains of Abraham, at the gates of the city. Both generals lost their lives there, and four years later New France was ceded to Great Britain. For others, the motto is less a regret than a loyalty: that of a people who, cut off from France, kept their language, for a long time their religion, and their institutions." }
  - { es: "Car c'est peut-être là que réside l'essentiel. Depuis la fondation de la ville par Samuel de Champlain, en 1608, le français a survécu sur ce continent malgré tout ce qui aurait dû le faire disparaître : la conquête, l'isolement, la pression d'une Amérique du Nord massivement anglophone. Il n'a pas survécu par hasard. Il a fallu des écoles, des journaux, des chansons, et, en 1977, une loi, la Charte de la langue française, qui fait du français la langue officielle du Québec et la langue normale du travail, de l'enseignement et du commerce. Se souvenir, ici, n'est pas une nostalgie : c'est un effort de chaque jour.", en: "For that may be where the essence lies. Since Samuel de Champlain founded the city in 1608, French has survived on this continent despite everything that should have made it disappear: the conquest, isolation, the pressure of an overwhelmingly English-speaking North America. It did not survive by chance. It took schools, newspapers, songs, and in 1977 a law, the Charter of the French Language, which made French the official language of Québec and the normal language of work, education and commerce. To remember, here, is not nostalgia: it is a daily effort." }
  - { es: "Certes, la mémoire peut aussi devenir un poids. Deux fois, en 1980 puis en 1995, les Québécois ont été appelés à se prononcer sur la souveraineté de la province ; deux fois, ils ont répondu non, la seconde fois à une très faible majorité. La question divise encore les familles, et les jeunes générations, plus mobiles, plus bilingues, regardent parfois ces débats avec une certaine distance. Mais même ceux qui ne partagent pas le rêve d'un pays indépendant tiennent à leur langue, à leur accent, à ces mots qui font sourire les visiteurs français et qui sont, pour eux, la preuve vivante d'une histoire.", en: "Admittedly, memory can also become a burden. Twice, in 1980 and then in 1995, Quebecers were asked to vote on the sovereignty of the province; twice they said no, the second time by a very narrow majority. The question still divides families, and the younger generations, more mobile and more bilingual, sometimes look at these debates with a certain detachment. But even those who do not share the dream of an independent country are attached to their language, their accent, those words that make French visitors smile and which are, for them, the living proof of a history." }
  - { es: "Le soir, depuis la terrasse Dufferin, au pied du château Frontenac, on voit le Saint-Laurent s'élargir vers l'océan, ce même fleuve que remontèrent les navires de Champlain il y a plus de quatre siècles. La vieille ville, avec ses remparts, ses rues étroites et ses toits de cuivre, a été inscrite au patrimoine mondial en 1985. On pourrait la prendre pour un décor, une ville-musée figée dans le passé. Ce serait une erreur. Québec n'est pas une ville qui regarde en arrière : c'est une ville qui se souvient pour pouvoir continuer d'avancer. Trois mots, gravés dans la pierre il y a plus d'un siècle, et qui n'ont jamais eu besoin de complément.", en: "In the evening, from the Dufferin Terrace at the foot of the Château Frontenac, you can see the St Lawrence widening towards the ocean, the same river up which Champlain's ships sailed more than four centuries ago. The old town, with its ramparts, its narrow streets and its copper roofs, was added to the World Heritage List in 1985. You might take it for a stage set, a museum city frozen in the past. That would be a mistake. Québec is not a city that looks backwards: it is a city that remembers so that it can keep moving forward. Three words, carved in stone more than a century ago, which have never needed an object." }
questions:
  - { q: "Pourquoi l'auteur dit-il que la devise est « comme une phrase interrompue » ?", options: ["Parce qu'elle n'a pas de complément : on ne dit pas de quoi on se souvient", "Parce qu'elle est mal écrite", "Parce qu'elle est en latin"], answer: 0, explain: "«Une devise sans complément»: se souvenir de… normally needs an object, which the motto leaves open." }
  - { q: "Qui a fait graver la devise, et où ?", options: ["Samuel de Champlain, sur le château Frontenac", "L'architecte Eugène-Étienne Taché, au-dessus de la porte de l'hôtel du Parlement, en 1883", "Le général Montcalm, sur les remparts"], answer: 1, explain: "«En 1883, l'architecte Eugène-Étienne Taché la fit graver au-dessus de la porte principale de l'hôtel du Parlement.»" }
  - { q: "Que s'est-il passé en 1759 sur les plaines d'Abraham ?", options: ["La fondation de la ville", "La victoire des troupes britanniques sur celles de Montcalm", "Le premier référendum"], answer: 1, explain: "Wolfe's British troops defeated Montcalm's; four years later New France was ceded to Great Britain." }
  - { q: "Selon l'auteur, pourquoi le français a-t-il survécu au Québec ?", options: ["Par hasard", "Grâce à un effort constant : écoles, journaux, chansons et la Charte de la langue française de 1977", "Parce que personne ne parlait anglais"], answer: 1, explain: "«Il n'a pas survécu par hasard. Il a fallu des écoles, des journaux, des chansons, et, en 1977, une loi…»" }
  - { q: "Quelle est l'idée de la conclusion ?", options: ["Québec est une ville-musée figée dans le passé", "Québec se souvient pour pouvoir continuer d'avancer", "La devise devrait être changée"], answer: 1, explain: "«Québec n'est pas une ville qui regarde en arrière : c'est une ville qui se souvient pour pouvoir continuer d'avancer.»" }
