id: a1.u15
title: 象形字
lessons:
  - id: a1.u15.l1
    title: 人、口、山
    teach: [g.pictograms, g.stroke-order]
    skills: [listen, speak, read, write]
    write: [人, 口, 山]
    tip: "Some characters began as pictures. 人 jan4 is a person walking on two legs, 口 hau2 is an open mouth, 山 saan1 is three mountain peaks. 口 also means 'opening': 出口 is the 'out opening', the exit!"
    vocab: [w.jan4, w.hau2, w.saan1.b, w.ceot1-hau2, w.jap6-hau2]
    sentences:
      - { es: "人。", en: "Person.", altEn: ["People.", "A person."], grammar: [g.pictograms], vocab: [w.jan4] }
      - { es: "口。", en: "Mouth.", altEn: ["A mouth.", "Opening."], grammar: [g.pictograms], vocab: [w.hau2] }
      - { es: "山。", en: "Mountain.", altEn: ["Hill.", "A mountain."], grammar: [g.pictograms], vocab: [w.saan1.b] }
      - { es: "一個人。", en: "One person.", altEn: ["A person."], grammar: [g.pictograms, g.classifiers-intro], vocab: [w.jan4] }
      - { es: "三個人。", en: "Three people.", grammar: [g.pictograms, g.classifiers-intro], vocab: [w.jan4] }
      - { es: "一座山。", en: "One mountain.", altEn: ["A mountain.", "One hill."], grammar: [g.pictograms, g.classifiers-intro], vocab: [w.saan1.b, w.zo6] }
      - { es: "山好高。", en: "The mountain is tall.", altEn: ["The mountain is high.", "The hill is high."], grammar: [g.pictograms], vocab: [w.saan1.b, w.gou1] }
      - { es: "出口。", en: "Exit.", altEn: ["The exit."], grammar: [g.pictograms], vocab: [w.ceot1-hau2] }
      - { es: "入口。", en: "Entrance.", altEn: ["The entrance.", "Way in."], grammar: [g.pictograms], vocab: [w.jap6-hau2] }
      - { es: "人、口、山。", en: "Person, mouth, mountain.", grammar: [g.pictograms], vocab: [w.jan4, w.hau2, w.saan1.b] }
    exchanges:
      - q: { es: "幾多個人呀？", en: "How many people?" }
        a: { es: "三個人。", en: "Three people." }
        alt: ["一個人。", "兩個人。"]
        grammar: [g.classifiers-intro]
        vocab: [w.jan4]
      - q: { es: "出口喺邊度呀？", en: "Where's the exit?" }
        a: { es: "喺嗰度。", en: "Over there." }
        alt: ["喺呢度。"]
        grammar: [g.pictograms]
        vocab: [w.ceot1-hau2]
      - q: { es: "山高唔高呀？", en: "Is the mountain tall?" }
        a: { es: "好高！", en: "Very tall!" }
        alt: ["好高呀！"]
        grammar: [g.pictograms]
        vocab: [w.saan1.b, w.gou1]
    texts:
      - title: "出口同入口"
        es: ["出口喺嗰度。", "入口喺呢度。"]
        en: ["The exit is over there.", "The entrance is here."]
        grammar: [g.pictograms]
        vocab: [w.ceot1-hau2, w.jap6-hau2]
  - id: a1.u15.l2
    title: 木、火、水
    teach: [g.pictograms, g.stroke-order]
    skills: [listen, speak, read, write]
    write: [木, 火, 水]
    tip: "木 muk6 is a tree: branches up, roots down. 火 fo2 is a fire with flames. 水 seoi2 is a stream with splashes. In speech a tree is 樹 syu6; 木 means wood."
    vocab: [w.muk6.b, w.fo2, w.seoi2, w.syu6, w.jam2, w.jit6]
    sentences:
      - { es: "木。", en: "Wood.", altEn: ["Tree.", "Wooden."], grammar: [g.pictograms], vocab: [w.muk6.b] }
      - { es: "火。", en: "Fire.", grammar: [g.pictograms], vocab: [w.fo2] }
      - { es: "水。", en: "Water.", grammar: [g.pictograms], vocab: [w.seoi2] }
      - { es: "火好熱！", en: "The fire is hot!", altEn: ["Fire is hot!", "The fire is very hot!"], grammar: [g.pictograms], vocab: [w.fo2, w.jit6] }
      - { es: "一杯水，唔該。", en: "A glass of water, please.", altEn: ["A cup of water, please.", "One glass of water, please."], grammar: [g.pictograms, g.mgoi-doze], vocab: [w.seoi2, w.bui1] }
      - { es: "我飲水。", en: "I drink water.", altEn: ["I'm drinking water."], grammar: [g.pictograms], vocab: [w.jam2, w.seoi2] }
      - { es: "一棵樹。", en: "One tree.", altEn: ["A tree."], grammar: [g.pictograms, g.classifiers-intro], vocab: [w.syu6, w.po1] }
      - { es: "好多樹。", en: "Lots of trees.", altEn: ["Many trees."], grammar: [g.pictograms], vocab: [w.syu6] }
      - { es: "山有好多樹。", en: "The mountain has lots of trees.", altEn: ["There are lots of trees on the mountain."], grammar: [g.pictograms, g.jau-have], vocab: [w.saan1.b, w.syu6] }
      - { es: "木、火、水。", en: "Wood, fire, water.", grammar: [g.pictograms], vocab: [w.muk6.b, w.fo2, w.seoi2] }
    exchanges:
      - q: { es: "你飲唔飲水呀？", en: "Would you like some water?" }
        a: { es: "飲，唔該。", en: "Yes, please." }
        alt: ["唔該。", "唔飲，多謝。"]
        grammar: [g.mgoi-doze]
        vocab: [w.jam2, w.seoi2]
      - q: { es: "火熱唔熱呀？", en: "Is the fire hot?" }
        a: { es: "好熱！", en: "Very hot!" }
        alt: ["好熱呀！"]
        grammar: [g.pictograms]
        vocab: [w.fo2, w.jit6]
      - q: { es: "山有冇樹呀？", en: "Are there trees on the mountain?" }
        a: { es: "有，好多樹。", en: "Yes, lots of trees." }
        alt: ["有呀。", "有好多。"]
        grammar: [g.jau-have]
        vocab: [w.syu6]
    texts:
      - title: "山上"
        es: ["山有好多樹。", "火好熱！", "我飲水。"]
        en: ["The mountain has lots of trees.", "The fire is hot!", "I drink water."]
        grammar: [g.pictograms]
        vocab: [w.syu6, w.fo2, w.seoi2]
  - id: a1.u15.l3
    title: 田、月、雨
    teach: [g.pictograms, g.stroke-order]
    skills: [listen, speak, read, write]
    write: [田, 月, 雨]
    tip: "田 tin4 is a field cut into four plots. 月 jyut6 is a crescent moon (it also means 'month'). 雨 jyu5 is the sky with rain drops falling. 'It's raining' is 落雨 lok6 jyu5: 'falling rain'."
    vocab: [w.tin4.b, w.jyut6, w.jyut6-loeng6, w.jyu5, w.lok6-jyu5, w.daai6]
    sentences:
      - { es: "田。", en: "Field.", altEn: ["A field."], grammar: [g.pictograms], vocab: [w.tin4.b] }
      - { es: "月。", en: "Moon.", altEn: ["Month.", "The moon."], grammar: [g.pictograms], vocab: [w.jyut6] }
      - { es: "雨。", en: "Rain.", grammar: [g.pictograms], vocab: [w.jyu5] }
      - { es: "落雨！", en: "It's raining!", grammar: [g.pictograms], vocab: [w.lok6-jyu5] }
      - { es: "又落雨！", en: "It's raining again!", grammar: [g.pictograms], vocab: [w.lok6-jyu5] }
      - { es: "雨好大。", en: "The rain is heavy.", altEn: ["It's raining hard."], grammar: [g.pictograms], vocab: [w.jyu5, w.daai6] }
      - { es: "月亮。", en: "The moon.", altEn: ["Moon."], grammar: [g.pictograms], vocab: [w.jyut6-loeng6] }
      - { es: "好大個月亮！", en: "What a big moon!", altEn: ["Such a big moon!"], grammar: [g.pictograms], vocab: [w.jyut6-loeng6, w.daai6] }
      - { es: "一塊田。", en: "One field.", altEn: ["A field."], grammar: [g.pictograms, g.classifiers-intro], vocab: [w.tin4.b, w.faai3] }
      - { es: "田好大。", en: "The field is big.", altEn: ["The field is very big."], grammar: [g.pictograms], vocab: [w.tin4.b, w.daai6] }
    exchanges:
      - q: { es: "落唔落雨呀？", en: "Is it raining?" }
        a: { es: "落緊雨！", en: "Yes, it's raining!" }
        alt: ["落雨呀！"]
        grammar: [g.pictograms]
        vocab: [w.lok6-jyu5]
      - q: { es: "月亮大唔大呀？", en: "Is the moon big?" }
        a: { es: "好大！", en: "Very big!" }
        alt: ["好大呀！"]
        grammar: [g.pictograms]
        vocab: [w.jyut6-loeng6, w.daai6]
      - q: { es: "呢個係咩字呀？", en: "What character is this?" }
        a: { es: "田字。", en: "The character 田 (field)." }
        alt: ["係田字。"]
        grammar: [g.pictograms]
        vocab: [w.tin4.b, w.zi6]
    texts:
      - title: "落雨"
        es: ["落雨！", "雨好大。", "冇月亮。"]
        en: ["It's raining!", "The rain is heavy.", "There's no moon."]
        grammar: [g.pictograms]
        vocab: [w.lok6-jyu5, w.jyut6-loeng6]
  - id: a1.u15.l4
    title: 門
    teach: [g.pictograms, g.stroke-order]
    skills: [listen, speak, read, write]
    write: [門, 人, 口, 山]
    tip: "門 mun4 is a pair of swinging doors. 門口 mun4 hau2 is 'door + opening': the doorway. Open is 開 hoi1, close is 閂 saan1: 開門, 閂門. Today you also write 人, 口 and 山 again."
    vocab: [w.mun4, w.mun4-hau2, w.daai6-mun4, w.muk6-mun4, w.hoi1-mun4, w.saan1]
    sentences:
      - { es: "門。", en: "Door.", altEn: ["Gate.", "A door."], grammar: [g.pictograms], vocab: [w.mun4] }
      - { es: "開門！", en: "Open the door!", grammar: [g.pictograms], vocab: [w.hoi1-mun4] }
      - { es: "閂門！", en: "Close the door!", altEn: ["Shut the door!"], grammar: [g.pictograms], vocab: [w.saan1, w.mun4] }
      - { es: "大門。", en: "The front door.", altEn: ["Front door.", "The main entrance.", "The main gate."], grammar: [g.pictograms], vocab: [w.daai6-mun4] }
      - { es: "木門。", en: "A wooden door.", altEn: ["Wooden door."], grammar: [g.pictograms], vocab: [w.muk6-mun4] }
      - { es: "我喺門口。", en: "I'm at the door.", altEn: ["I'm at the doorway.", "I'm at the entrance."], grammar: [g.pictograms, g.hai2-location], vocab: [w.mun4-hau2] }
      - { es: "唔該開門！", en: "Open the door, please!", altEn: ["Please open the door!"], grammar: [g.pictograms, g.mgoi-doze], vocab: [w.hoi1-mun4] }
      - { es: "山同水。", en: "Mountains and water.", altEn: ["Mountain and water."], grammar: [g.pictograms], vocab: [w.saan1.b, w.seoi2] }
      - { es: "田同山。", en: "Fields and mountains.", altEn: ["Field and mountain."], grammar: [g.pictograms], vocab: [w.tin4.b, w.saan1.b] }
      - { es: "人、口、山、木。", en: "Person, mouth, mountain, tree.", altEn: ["Person, mouth, mountain, wood."], grammar: [g.pictograms], vocab: [w.jan4, w.hau2, w.saan1.b, w.muk6.b] }
    exchanges:
      - q: { es: "你喺邊度呀？", en: "Where are you?" }
        a: { es: "我喺門口。", en: "I'm at the door." }
        alt: ["喺門口。"]
        grammar: [g.hai2-location]
        vocab: [w.mun4-hau2]
      - q: { es: "唔該開門！", en: "Open the door, please!" }
        a: { es: "好呀！", en: "OK!" }
        alt: ["好！"]
        grammar: [g.mgoi-doze]
        vocab: [w.hoi1-mun4]
      - q: { es: "呢個係咩字呀？", en: "What character is this?" }
        a: { es: "門字。", en: "The character 門 (door)." }
        alt: ["係門字。"]
        grammar: [g.pictograms]
        vocab: [w.mun4, w.zi6]
    texts:
      - title: "喺門口"
        es: ["Leo喺門口。", "唔該開門！", "唔該晒！"]
        en: ["Leo is at the door.", "Open the door, please!", "Thanks so much!"]
        grammar: [g.pictograms, g.mgoi-doze]
        vocab: [w.mun4-hau2, w.hoi1-mun4]
