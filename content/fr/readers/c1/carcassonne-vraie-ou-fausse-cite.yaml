id: r.c1.carcassonne-vraie-ou-fausse-cite
level: c1
title: Carcassonne, vraie ou fausse cité ?
kind: text
intro: "An argumentative essay in the classic French three-part structure (thesis, antithesis, synthesis) on the nineteenth-century restoration of Carcassonne. Follow the problématique set out in the introduction and the precise logical connectors (en effet, or, certes, toutefois, d'ailleurs, en somme)."
allow: [aspect, image, images, militaire, défenseurs, reconnaissance, évoluer, carcassonne, viollet-le-duc, mérimée, prosper, cros-mayrevieille, aude, languedoc, unesco, disney, hollywood, robin, médiévale, médiévales, médiéval, médiévaux]
paragraphs:
  - { es: "Chaque année, des millions de visiteurs franchissent la porte Narbonnaise et découvrent, au-dessus de la vallée de l'Aude, la Cité de Carcassonne : deux enceintes, cinquante-deux tours et environ trois kilomètres de remparts. Pour beaucoup, c'est l'image parfaite du Moyen Âge, si parfaite qu'elle a servi de décor à des films. Or, une partie de ce que l'on admire n'a pas huit cents ans, mais à peine cent cinquante. On peut donc se demander si Carcassonne est encore une cité médiévale ou si elle est devenue une œuvre du XIXe siècle.", en: "Every year millions of visitors pass through the Porte Narbonnaise and discover, above the Aude valley, the Cité of Carcassonne: two rings of walls, fifty-two towers and about three kilometres of ramparts. For many, it is the perfect image of the Middle Ages, so perfect that it has been used as a film set. Yet part of what we admire is not eight hundred years old but barely a hundred and fifty. We may therefore ask whether Carcassonne is still a medieval city or whether it has become a nineteenth-century work." }
  - { es: "Il faut d'abord rappeler l'histoire. Au début du XIXe siècle, la Cité, qui n'avait plus aucun rôle militaire, tombait en ruine ; les habitants en prenaient les pierres pour construire leurs maisons, et l'État envisagea même de la démolir. Quelques passionnés, parmi lesquels l'écrivain Prosper Mérimée, alors inspecteur des monuments historiques, se mobilisèrent pour la sauver. À partir de 1853, l'architecte Viollet-le-Duc fut chargé de la restaurer. Les travaux durèrent plus d'un demi-siècle et se poursuivirent après sa mort, en 1879.", en: "We must first recall the history. At the beginning of the nineteenth century the Cité, which no longer had any military role, was falling into ruin; the inhabitants took its stones to build their houses, and the State even considered demolishing it. A few enthusiasts, among them the writer Prosper Mérimée, then inspector of historic monuments, campaigned to save it. From 1853 the architect Viollet-le-Duc was put in charge of restoring it. The work lasted more than half a century and went on after his death in 1879." }
  - { es: "Pour les défenseurs de Viollet-le-Duc, la réponse est claire : sans lui, il n'y aurait plus de Cité du tout. En effet, la restauration a sauvé un ensemble menacé de disparition. D'ailleurs, l'architecte ne travaillait pas au hasard : il étudiait chaque pierre, comparait les tours entre elles et s'appuyait sur les connaissances de son temps. Enfin, la Cité restaurée a fait vivre toute la ville, grâce au tourisme. Sa reconnaissance par l'UNESCO, en 1997, semble d'ailleurs confirmer la valeur de ce travail.", en: "For Viollet-le-Duc's defenders the answer is clear: without him there would be no Cité at all. Indeed, the restoration saved a group of buildings threatened with disappearance. Moreover, the architect did not work at random: he studied every stone, compared the towers with one another and relied on the knowledge of his time. Finally, the restored Cité has supported the whole town through tourism. Its recognition by UNESCO in 1997 seems, moreover, to confirm the value of this work." }
  - { es: "Certes, mais ses critiques ne manquent pas d'arguments. Viollet-le-Duc ne se contentait pas de réparer : il voulait rendre au monument un état idéal, « qui peut n'avoir jamais existé à un moment donné », selon ses propres mots. Le meilleur exemple est celui des toits. L'architecte a coiffé les tours de toits pointus couverts d'ardoise, comme dans le nord de la France, alors que dans le Languedoc on construisait plutôt des toits presque plats, couverts de tuiles. Dès le XIXe siècle, on lui a reproché d'avoir inventé un Moyen Âge de livre d'images.", en: "Admittedly, but his critics are not short of arguments. Viollet-le-Duc was not content to repair: he wanted to give the monument back an ideal state, 'which may never have existed at any given moment', in his own words. The best example is the roofs. The architect capped the towers with pointed slate roofs, as in northern France, whereas in Languedoc people tended to build almost flat roofs covered with tiles. As early as the nineteenth century he was accused of inventing a picture-book Middle Ages." }
  - { es: "Ce n'est pas tout. Pour retrouver l'aspect d'une forteresse, on a fait disparaître une partie de la vie qui s'était installée dans la Cité au fil des siècles : des maisons construites contre les remparts ont été détruites, et l'espace entre les deux enceintes, les lices, a été vidé. Le visiteur d'aujourd'hui voit donc une Cité plus « médiévale » qu'elle ne l'était en 1840, mais aussi plus vide. Pour certains historiens, c'est là le principal défaut de ce genre de restauration : à force de vouloir montrer un seul moment du passé, on efface tous les autres.", en: "That is not all. To recover the look of a fortress, part of the life that had settled in the Cité over the centuries was made to disappear: houses built against the ramparts were destroyed, and the space between the two rings of walls, the lists, was emptied. Today's visitor therefore sees a Cité that is more 'medieval' than it was in 1840, but also emptier. For some historians this is the main flaw of this kind of restoration: by trying so hard to show a single moment of the past, you erase all the others." }
  - { es: "Toutefois, opposer le « vrai » et le « faux » n'a peut-être pas beaucoup de sens. Un monument n'est jamais figé : chaque époque le transforme, le répare, l'adapte à ses besoins. La Cité elle-même avait déjà été modifiée bien des fois avant Viollet-le-Duc. Sa restauration fait désormais partie de son histoire, au même titre que les sièges du Moyen Âge. D'ailleurs, les restaurations plus récentes ont parfois fait d'autres choix, en couvrant certaines tours de tuiles pour se rapprocher de l'état ancien : la Cité continue donc d'évoluer.", en: "However, setting the 'true' against the 'false' may not make much sense. A monument is never frozen: each era transforms it, repairs it, adapts it to its needs. The Cité itself had already been altered many times before Viollet-le-Duc. Its restoration is now part of its history, just as much as the medieval sieges. Indeed, more recent restorations have sometimes made different choices, roofing some towers with tiles to come closer to the earlier state: so the Cité is still evolving." }
  - { es: "En somme, Carcassonne n'est ni tout à fait vraie ni tout à fait fausse. C'est un monument à deux voix : celle des bâtisseurs du Moyen Âge et celle d'un architecte du XIXe siècle qui rêvait du Moyen Âge. Plutôt que de chercher à les séparer, le visiteur gagnerait à apprendre à les reconnaître. Car c'est peut-être là que réside la vraie leçon de Carcassonne : le patrimoine n'est pas seulement ce que le passé nous a laissé, c'est aussi ce que chaque génération décide d'en faire.", en: "In short, Carcassonne is neither entirely true nor entirely false. It is a monument with two voices: that of the medieval builders and that of a nineteenth-century architect who dreamed of the Middle Ages. Rather than trying to separate them, visitors would do well to learn to recognise them. For that may be where the real lesson of Carcassonne lies: heritage is not only what the past has left us, it is also what each generation decides to do with it." }
questions:
  - { q: "Quelle est la problématique de l'essai ?", options: ["Faut-il démolir la Cité ?", "Carcassonne est-elle encore une cité médiévale ou une œuvre du XIXe siècle ?", "Combien de touristes la Cité reçoit-elle ?"], answer: 1, explain: "The introduction ends with the question: «On peut donc se demander si Carcassonne est encore une cité médiévale ou si elle est devenue une œuvre du XIXe siècle.»" }
  - { q: "Quelle était la situation de la Cité au début du XIXe siècle ?", options: ["Elle était en parfait état", "Elle tombait en ruine et l'État envisagea de la démolir", "C'était une base militaire importante"], answer: 1, explain: "«La Cité… tombait en ruine… et l'État envisagea même de la démolir.»" }
  - { q: "Quel reproche fait-on aux toits de Viollet-le-Duc ?", options: ["Ils sont trop bas", "Ce sont des toits pointus en ardoise, typiques du nord, et non des toits plats en tuiles du Languedoc", "Ils sont en verre"], answer: 1, explain: "He used pointed slate roofs «comme dans le nord de la France», whereas Languedoc had almost flat tiled roofs." }
  - { q: "Quel connecteur introduit l'antithèse (la partie critique) ?", options: ["En effet", "Certes, mais", "En somme"], answer: 1, explain: "«Certes, mais…» concedes the previous point and introduces the opposing view; en effet confirms, en somme concludes." }
  - { q: "Quelle est la conclusion de l'auteur ?", options: ["La Cité est totalement fausse", "La Cité est un monument « à deux voix », et le patrimoine est aussi ce que chaque génération en fait", "Il faut refaire tous les toits"], answer: 1, explain: "«Carcassonne n'est ni tout à fait vraie ni tout à fait fausse. C'est un monument à deux voix.»" }
