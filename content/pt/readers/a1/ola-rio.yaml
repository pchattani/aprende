id: r.a1.ola-rio
level: a1
title: Olá, Rio!
kind: text
intro: Kate, an American student, has just landed at Galeão airport and introduces herself, her teacher and her host family in Rio.
allow: [kate, boston, lima, sandra, marcelo, rafa, galeão, tijuca, ok]
paragraphs:
  - { es: "Oi, tudo bem? Meu nome é Kate. Eu sou americana, de Boston, e tenho vinte e quatro anos. Sou estudante de música. Agora estou no Aeroporto do Galeão, no Rio de Janeiro. Estou cansada, mas muito feliz!", en: "Hi, how are you? My name is Kate. I'm American, from Boston, and I'm twenty-four. I'm a music student. Right now I'm at Galeão Airport, in Rio de Janeiro. I'm tired, but very happy!" }
  - { es: "Eu estou no Brasil para aprender português. Falo inglês e um pouco de espanhol. O português é uma língua bonita, mas não é fácil. Minha professora de português se chama Sandra. Ela é carioca, é jovem e muito simpática.", en: "I'm in Brazil to learn Portuguese. I speak English and a little Spanish. Portuguese is a beautiful language, but it isn't easy. My Portuguese teacher is called Sandra. She's from Rio, she's young and very nice." }
  - { es: "No Rio, eu moro com uma família brasileira, num apartamento na Tijuca. O senhor Lima é engenheiro e a dona Célia é médica. Eles são muito gentis. Eles têm um filho, o Rafa. O Rafa tem dezenove anos, é alto, moreno e um pouco tímido. A família também tem um cachorro pequeno e velho. O nome dele é Bolinha.", en: "In Rio, I live with a Brazilian family, in a flat in Tijuca. Mr Lima is an engineer and Dona Célia is a doctor. They're very kind. They have a son, Rafa. Rafa is nineteen, tall, dark-haired and a bit shy. The family also has a small, old dog. His name is Bolinha." }
  - { es: "O apartamento é grande e confortável. Meu quarto é pequeno, mas tem uma janela com vista para o morro. A cozinha é a parte favorita da casa: a dona Célia cozinha muito bem, e o café da manhã tem pão de queijo, frutas e café.", en: "The flat is big and comfortable. My room is small, but it has a window with a view of the hill. The kitchen is the favourite part of the house: Dona Célia cooks very well, and breakfast has pão de queijo, fruit and coffee." }
  - { es: "Amanhã começa a aula. A primeira aula é às nove horas. Eu estou um pouco nervosa, mas também contente. O Rio é grande, quente e lindo, e eu estou aqui! Tchau, até logo!", en: "Class starts tomorrow. The first class is at nine o'clock. I'm a bit nervous, but happy too. Rio is big, hot and beautiful, and I'm here! Bye, see you later!" }
questions:
  - { q: "De onde é a Kate?", options: ["Do Rio de Janeiro", "De Boston", "Da Espanha"], answer: 1, explain: "Kate says «Eu sou americana, de Boston»." }
  - { q: "Por que a Kate está no Brasil?", options: ["Para trabalhar", "Para aprender português", "Para visitar a família"], answer: 1, explain: "«Eu estou no Brasil para aprender português.»" }
  - { q: "Quem é o Rafa?", options: ["O professor da Kate", "O filho do senhor Lima e da dona Célia", "O cachorro da família"], answer: 1, explain: "The Limas «têm um filho, o Rafa». The dog is Bolinha and the teacher is Sandra." }
  - { q: "Qual é a profissão da dona Célia?", options: ["Professora", "Engenheira", "Médica"], answer: 2, explain: "«A dona Célia é médica.» Her husband is the engineer." }
  - { q: "Como é o quarto da Kate?", options: ["Pequeno, com vista para o morro", "Grande e confortável", "Perto da cozinha"], answer: 0, explain: "«Meu quarto é pequeno, mas tem uma janela com vista para o morro.» It's the flat that is big and comfortable." }
glossary:
  - { es: parte, en: part }
