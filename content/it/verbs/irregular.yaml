  # ---- -ire verbs with irregular participles
  - lemma: aprire
    participle: aperto
    alt: [apersi, aperse, apersero]
  - lemma: coprire
    participle: coperto
  - lemma: offrire
    participle: offerto
    alt: [offersi, offerse, offersero]

  # ---- -iare verbs with a stressed i (invìo → tu invii)
  - lemma: inviare
    stressedI: true
  - lemma: sciare
    stressedI: true
  - lemma: spiare
    stressedI: true
  - lemma: avviare
    stressedI: true
  - lemma: deviare
    stressedI: true

# Regular verbs whose compound tenses take essere (motion, change of state, "happen",
# "seem", "cost", "be enough"…). Reflexive verbs always take essere.
essere:
  - arrivare
  - entrare
  - tornare
  - ritornare
  - restare
  - diventare
  - partire
  - costare
  - durare
  - sembrare
  - bastare
  - capitare
  - dimagrire
  - ingrassare
  - invecchiare
  - impazzire
  - arrossire
  - scappare
  - fuggire
  - sparire
  - risultare
  - bisognare
  - svanire
  - rientrare
  - ripartire

# Compounds that take avere although their base verb takes essere.
avere:
  - aggiungere
  - raggiungere
  - prevenire
  - assalire
  - compiacere

# Both auxiliaries; essere shown in the table (sono passato / ho passato l'esame).
essereOrAvere:
  - passare
  - mancare
  - servire
  - guarire
  - nevicare

# Both auxiliaries; avere shown in the table (ho cominciato / il film è cominciato).
avereOrEssere:
  - cominciare
  - iniziare
  - finire
  - cambiare
  - volare
  - continuare
  - terminare
  - migliorare
  - peggiorare
  - aumentare
  - diminuire
  - saltare
