  - id: a1.u12.l4
    title: "Je viens d'arriver, j'habite ici depuis un an"
    teach: [g.venir-de, g.depuis-present]
    vocab: [w.venir-de, w.depuis, w.vivre, w.presque, w.souvenir, w.fin, w.début, w.encore, w.mémoire]
    tip: "Venir de + infinitive = to have just done (je viens d'arriver). Depuis + present = for / since, for things still true now (j'habite ici depuis un an)."
    sentences:
      - { es: "Je viens d'arriver à Paris.", en: "I've just arrived in Paris.", altEs: ["Je viens juste d'arriver à Paris."], altEn: ["I just arrived in Paris."], grammar: [g.venir-de], vocab: [w.venir-de], error: { wrong: "Je viens arriver à Paris.", explain: "Venir de + infinitive = to have just done: je viens d'arriver. Without de it means 'I'm coming to…'.", grammar: g.venir-de } }
      - { es: "Le train vient de partir.", en: "The train has just left.", altEn: ["The train just left."], grammar: [g.venir-de], vocab: [w.venir-de], transform: { instruction: "Change to the near future (going to)", answer: "Le train va partir.", en: "The train is about to leave." } }
      - { es: "Nous venons de manger, merci.", en: "We've just eaten, thanks.", altEs: ["On vient de manger, merci."], altEn: ["We just ate, thank you."], grammar: [g.venir-de], vocab: [w.venir-de] }
      - { es: "J'habite à Paris depuis deux ans.", en: "I've been living in Paris for two years.", altEs: ["Ça fait deux ans que j'habite à Paris."], altEn: ["I've lived in Paris for two years."], grammar: [g.depuis-present], vocab: [w.depuis], error: { wrong: "J'ai habité à Paris depuis deux ans.", explain: "For something still true now, French uses the present with depuis: j'habite à Paris depuis deux ans.", grammar: g.depuis-present } }
      - { es: "Depuis quand tu apprends le français ? — Depuis janvier.", en: "Since when have you been learning French? — Since January.", altEs: ["Tu apprends le français depuis quand ? — Depuis janvier.", "Depuis quand apprends-tu le français ? — Depuis janvier."], grammar: [g.depuis-present], vocab: [w.depuis, w.apprendre] }
      - { es: "Depuis combien de temps vous êtes en France ? — Depuis trois semaines.", en: "How long have you been in France? — For three weeks.", altEs: ["Vous êtes en France depuis combien de temps ? — Depuis trois semaines.", "Depuis combien de temps êtes-vous en France ? — Depuis trois semaines."], grammar: [g.depuis-present], vocab: [w.depuis] }
      - { es: "Je t'attends depuis une heure !", en: "I've been waiting for you for an hour!", altEs: ["Ça fait une heure que je t'attends !"], grammar: [g.depuis-present, g.present-re-verbs], vocab: [w.depuis, w.attendre], transform: { instruction: "Use vous instead of tu", answer: "Je vous attends depuis une heure !", alt: ["Ça fait une heure que je vous attends !"], en: "I've been waiting for you for an hour! (formal)" } }
      - { es: "Elle vit à Paris depuis presque dix ans.", en: "She's been living in Paris for almost ten years.", altEs: ["Elle habite à Paris depuis presque dix ans."], altEn: ["She has lived in Paris for nearly ten years."], grammar: [g.depuis-present], vocab: [w.vivre, w.presque] }
      - { es: "Ils viennent de finir le cours.", en: "They've just finished the class.", altEs: ["Elles viennent de finir le cours."], altEn: ["They just finished the lesson."], grammar: [g.venir-de], vocab: [w.venir-de], transform: { instruction: "Change to 'I'", answer: "Je viens de finir le cours.", en: "I've just finished the class." } }
      - { es: "Au début, je ne comprends rien ; à la fin, je comprends presque tout.", en: "At the start I don't understand anything; by the end I understand almost everything.", altEs: ["Au début, je ne comprends rien, et à la fin, je comprends presque tout."], grammar: [g.negation-ne-pas], vocab: [w.début, w.fin, w.presque] }
      - { es: "C'est un beau souvenir de Paris.", en: "It's a lovely souvenir of Paris.", altEn: ["It's a lovely memory of Paris."], grammar: [g.adjective-position], vocab: [w.souvenir] }
      - { es: "Encore un café, s'il vous plaît !", en: "Another coffee, please!", altEs: ["Un autre café, s'il vous plaît !"], altEn: ["One more coffee, please!"], grammar: [g.je-voudrais], vocab: [w.encore] }
      - { es: "Tu as une bonne mémoire !", en: "You have a good memory!", altEs: ["Vous avez une bonne mémoire !"], altEn: ["You've got a good memory!"], grammar: [g.adjective-position], vocab: [w.mémoire] }
      - { es: "On vient de voir le défilé, et maintenant on va voir le feu d'artifice.", en: "We've just seen the parade, and now we're going to see the fireworks.", altEs: ["Nous venons de voir le défilé, et maintenant nous allons voir le feu d'artifice."], grammar: [g.venir-de, g.futur-proche], vocab: [w.venir-de, w.défilé, w.feu-d-artifice] }
      - { es: "Ça fait combien de temps que tu vis ici ?", en: "How long have you been living here?", altEs: ["Depuis combien de temps tu vis ici ?", "Tu vis ici depuis combien de temps ?"], grammar: [g.depuis-present], vocab: [w.vivre] }
    exchanges:
      - q: { es: "Tu habites ici depuis quand ?", en: "Since when have you lived here?" }
