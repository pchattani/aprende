  - { es: 貨車, en: "van, lorry" }
  - { es: 運費, en: delivery charge }
  - { es: 嚇死人, en: shocking(ly) }
  - { es: 廣場, en: plaza }
  - { es: 侍應, en: waiter }
  - { es: 海灣, en: bay }
  - { es: 夕陽, en: setting sun }
  - { es: 專門, en: "special, dedicated" }
