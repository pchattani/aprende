id: r.b2.on-aurait-du-louer-un-pedalo
level: b2
title: "Annecy : on aurait dû louer un pédalo"
kind: dialogue
intro: Camille and Julien are spending a summer day at Lake Annecy. Things don't go to plan, and the reproaches start (tu aurais dû, on aurait pu). A local newspaper adds some unconfirmed news, in the «journalistic» conditional.
allow: [haute-savoie, julien, thiou, talloires, sila, ok, centre]
paragraphs:
  - { es: "Camille : Je te l'avais dit, Julien ! On aurait dû réserver le bateau hier. Maintenant, il n'y a plus rien jusqu'à dix-sept heures.", en: "Camille: I told you so, Julien! We should have booked the boat yesterday. Now there's nothing left until five o'clock." }
  - { es: "Julien : Comment est-ce que j'aurais pu savoir qu'il y aurait autant de monde un mardi ? En plus, c'est toi qui voulais faire la grasse matinée.", en: "Julien: How could I have known there'd be so many people on a Tuesday? Besides, you're the one who wanted a lie-in." }
  - { es: "Camille : Bon, ne nous disputons pas. On pourrait louer un pédalo, alors ? Il en reste deux, là-bas.", en: "Camille: OK, let's not argue. We could rent a pedalo, then? There are two left, over there." }
  - { es: "Julien : Un pédalo ? Pour traverser le lac ? Il fait quatorze kilomètres de long ! Tu aurais dû me prévenir que tu voulais faire du sport.", en: "Julien: A pedalo? To cross the lake? It's fourteen kilometres long! You should have warned me you wanted to do sport." }
  - { es: "Camille : Pas pour le traverser, juste pour aller nous baigner au milieu. Regarde cette eau : elle est transparente. On dit que c'est un des lacs les plus purs d'Europe.", en: "Camille: Not to cross it, just to go for a swim in the middle. Look at that water: it's crystal clear. They say it's one of the cleanest lakes in Europe." }
  - { es: "Julien : C'est vrai, mais ça n'a pas toujours été le cas. J'ai lu qu'au milieu du vingtième siècle, le lac était très pollué. Les villages y rejetaient leurs eaux usées. À partir de la fin des années cinquante, les communes se sont réunies pour construire un grand égout tout autour du lac, afin que les eaux sales n'y arrivent plus. Sans ça, on ne pourrait sans doute pas s'y baigner aujourd'hui.", en: "Julien: True, but it hasn't always been that way. I read that in the middle of the twentieth century the lake was very polluted. The villages discharged their waste water into it. From the late fifties the local councils joined forces to build a big sewer all the way round the lake, so that dirty water wouldn't reach it anymore. Without that, we probably couldn't swim in it today." }
  - { es: "Camille : Tu vois, tu sais tout ! Tu aurais pu être guide. Bon, on y va, à ce pédalo ?", en: "Camille: You see, you know everything! You could have been a guide. Right, are we going for this pedalo?" }
  - { es: "(Une heure plus tard, au milieu du lac…)", en: "(An hour later, in the middle of the lake…)" }
  - { es: "Julien : Camille… Tu as pris la crème solaire ?", en: "Julien: Camille… Did you bring the sun cream?" }
  - { es: "Camille : Non, je croyais que tu l'avais mise dans ton sac.", en: "Camille: No, I thought you'd put it in your bag." }
  - { es: "Julien : Génial. Et l'eau ? Tu as pris de l'eau ?", en: "Julien: Great. And water? Did you bring any water?" }
  - { es: "Camille : Tu aurais pu y penser toi-même, non ? Tu n'es pas un enfant !", en: "Camille: You could have thought of it yourself, couldn't you? You're not a child!" }
  - { es: "Julien : D'accord, d'accord. On n'aurait jamais dû quitter la plage. Regarde ces nuages au-dessus des montagnes. Le vent se lève.", en: "Julien: OK, OK. We should never have left the beach. Look at those clouds above the mountains. The wind's getting up." }
  - { es: "Camille : Alors pédale plus vite au lieu de te plaindre !", en: "Camille: Then pedal faster instead of complaining!" }
  - { es: "(Le soir, à la terrasse d'un café au bord du Thiou, Julien lit le journal local.)", en: "(In the evening, on a café terrace beside the Thiou, Julien reads the local paper.)" }
  - { es: "Julien : Écoute ça : « Un orage aurait surpris plusieurs pédalos cet après-midi au large de Talloires. Selon les premières informations, aucun blessé ne serait à déplorer. Les secours seraient intervenus pour ramener au port deux touristes qui n'avaient ni eau ni crème solaire. Leur identité n'a pas été communiquée. »", en: "Julien: Listen to this: 'A storm is reported to have surprised several pedalos this afternoon off Talloires. According to initial reports, no one was injured. Rescue services are said to have brought two tourists back to the harbour who had neither water nor sun cream. Their identity has not been released.'" }
  - { es: "Camille : Heureusement qu'ils n'ont pas donné nos noms…", en: "Camille: Thank goodness they didn't give our names…" }
  - { es: "Julien : Ils auraient pu nous prendre en photo, remarque. On aurait été célèbres dans toute la Haute-Savoie.", en: "Julien: They could have taken our photo, mind you. We'd have been famous all over Haute-Savoie." }
  - { es: "Camille : Très drôle. Demain, on reste en ville. Il paraît que le festival du cinéma d'animation existe ici depuis 1960 : on pourrait aller voir un film, à l'ombre, sans pédaler.", en: "Camille: Very funny. Tomorrow we're staying in town. Apparently the animation film festival has been held here since 1960: we could go and see a film, in the shade, without pedalling." }
  - { es: "Julien : D'accord. Mais la prochaine fois qu'on vient au lac, on réserve le bateau la veille. Et c'est toi qui prends le sac.", en: "Julien: Fine. But next time we come to the lake, we book the boat the day before. And you carry the bag." }
questions:
  - { q: "Qu'est-ce que Camille reproche à Julien au début ?", options: ["De ne pas avoir réservé le bateau la veille", "D'avoir oublié la crème solaire", "D'être arrivé en retard"], answer: 0, explain: "«On aurait dû réserver le bateau hier.» Devoir in the past conditional = should have." }
  - { q: "Pourquoi le lac d'Annecy est-il propre aujourd'hui ?", options: ["Parce qu'il n'y a pas de villages autour", "Parce qu'on a construit un égout tout autour du lac", "Parce que la baignade est interdite"], answer: 1, explain: "From the late fifties the councils built «un grand égout tout autour du lac, afin que les eaux sales n'y arrivent plus»." }
  - { q: "Qu'est-ce qu'ils ont oublié de prendre sur le pédalo ?", options: ["Leurs maillots de bain", "L'eau et la crème solaire", "Le journal"], answer: 1, explain: "Neither brought the sun cream nor the water – each thought the other had." }
  - { q: "Dans l'article, pourquoi le journaliste utilise-t-il « aurait surpris », « seraient intervenus » ?", options: ["Pour parler du futur", "Pour donner une information non confirmée", "Pour exprimer un regret"], answer: 1, explain: "The journalistic conditional reports unconfirmed information: reportedly, allegedly." }
  - { q: "Qui sont probablement les deux touristes de l'article ?", options: ["Des inconnus", "Camille et Julien", "Les guides du lac"], answer: 1, explain: "Two tourists «qui n'avaient ni eau ni crème solaire» – Camille is relieved their names weren't given." }
glossary:
  - { es: "faire la grasse matinée", en: to have a lie-in }
  - { es: grasse, en: "(faire la grasse matinée = to have a lie-in)" }
  - { es: milieu, en: middle }
  - { es: purs, en: "pure, clean" }
  - { es: rejetaient, en: discharged }
  - { es: "eaux usées", en: waste water }
  - { es: communes, en: "local councils, towns" }
  - { es: pédale, en: pedal }
  - { es: "au large de", en: off (the coast of) }
  - { es: large, en: "(au large de = off)" }
  - { es: déplorer, en: "to report (sadly), deplore" }
  - { es: intervenus, en: "intervened, came out" }
  - { es: communiquée, en: "released, communicated" }
