id: r.a1.en-el-mercado
level: a1
title: En el mercado
kind: dialogue
intro: Yuki does her weekly shopping at a market stall in Madrid.
paragraphs:
  - { es: "Vendedor: ¡Buenos días! ¿Qué le pongo?", en: "Seller: Good morning! What can I get you?" }
  - { es: "Yuki: Buenos días. Quiero un kilo de tomates y medio kilo de cebollas, por favor.", en: "Yuki: Good morning. I want a kilo of tomatoes and half a kilo of onions, please." }
  - { es: "Vendedor: Muy bien. Los tomates están muy ricos hoy. ¿Algo más?", en: "Seller: Very good. The tomatoes are very good today. Anything else?" }
  - { es: "Yuki: Sí, ¿cuánto cuestan las naranjas?", en: "Yuki: Yes, how much are the oranges?" }
  - { es: "Vendedor: Dos euros el kilo. Son de Valencia, muy dulces.", en: "Seller: Two euros a kilo. They're from Valencia, very sweet." }
  - { es: "Yuki: Pues dos kilos de naranjas y también tres plátanos y unas manzanas verdes.", en: "Yuki: Then two kilos of oranges and also three bananas and some green apples." }
  - { es: "Vendedor: Aquí tiene. ¿Quiere fresas? Están de oferta: tres euros la caja.", en: "Seller: Here you are. Do you want strawberries? They're on offer: three euros a box." }
  - { es: "Yuki: No, gracias, hoy no. ¿Cuánto es todo?", en: "Yuki: No, thanks, not today. How much is everything?" }
  - { es: "Vendedor: A ver… tomates, cebollas, naranjas, plátanos y manzanas. Son once euros con veinte.", en: "Seller: Let's see… tomatoes, onions, oranges, bananas and apples. That's eleven euros twenty." }
  - { es: "Yuki: ¿Puedo pagar con tarjeta?", en: "Yuki: Can I pay by card?" }
  - { es: "Vendedor: Lo siento, solo efectivo. Hay un banco en la esquina.", en: "Seller: Sorry, cash only. There's a bank on the corner." }
  - { es: "Yuki: No pasa nada, tengo quince euros. Aquí tiene.", en: "Yuki: No problem, I have fifteen euros. Here you are." }
  - { es: "Vendedor: Gracias. Y tres euros con ochenta de cambio. ¡Hasta la semana que viene!", en: "Seller: Thanks. And three euros eighty change. See you next week!" }
questions:
  - { q: "How much are the oranges?", options: ["One euro a kilo", "Two euros a kilo", "Three euros a box"], answer: 1 }
  - { q: "What does Yuki not buy?", options: ["Bananas", "Strawberries", "Onions"], answer: 1 }
  - { q: "Why can't Yuki pay by card?", options: ["The machine is broken", "The stall only takes cash", "She has no card"], answer: 1 }
glossary:
  - { es: vendedor, en: seller }
  - { es: kilo, en: kilo }
  - { es: medio, en: half }
  - { es: caja, en: box }
  - { es: cambio, en: change }
  - { es: ¿Qué le pongo?, en: What can I get you? }
