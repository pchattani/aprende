    model: { es: "L'année dernière, je me promenais à Arles au moment où le soleil se couchait. Dès que j'ai vu la lumière sur le Rhône, j'ai compris pourquoi Van Gogh aimait cette ville. Tandis que mon ami prenait des photos, je remarquais les couleurs du ciel. Nous sommes restés sur le quai jusqu'à ce qu'il fasse nuit. Une fois que nous sommes rentrés, j'ai essayé de peindre ce moment.", en: "Last year I was walking in Arles just as the sun was setting. As soon as I saw the light on the Rhône, I understood why Van Gogh loved this town. While my friend was taking photos, I was noticing the colours of the sky. We stayed on the quay until it was dark. Once we got back, I tried to paint that moment." }
  - task: "Tell the story of a misunderstanding (un malentendu) with a friend: what had happened before, how you realised, and how you made up."
    min: 50
