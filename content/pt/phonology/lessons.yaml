lessons:
  - id: ph.vowels
    title: Seven vowels, open and closed
    explanation: |
      Portuguese writes five vowel letters but, in stressed syllables, pronounces **seven** oral vowels: **a** /a/, **é** /ɛ/ (open, as in "bed"), **ê** /e/ (closed, as in French "été"), **i** /i/, **ó** /ɔ/ (open, as in "law"), **ô** /o/ (closed, as in French "eau"), **u** /u/. The difference between open and closed e and o changes meaning: *avó* (grandmother) vs *avô* (grandfather).

      The accent tells you when it is written: **´** marks an open vowel (*café*, *avó*), **^** a closed one (*você*, *avô*). Without an accent you have to learn the word: *bolo* has a closed o, *bola* an open one.

      ### Unstressed vowels in Brazil
      - Final unstressed **-o** sounds /u/: *bolo* /ˈbo.lu/, *carro* /ˈka.hu/.
      - Final unstressed **-e** sounds /i/: *leite* /ˈlej.tʃi/, *noite* /ˈnoj.tʃi/.
      - Final **-a** is a weak /ɐ/, like the a in "sofa": *casa* /ˈka.zɐ/.
    items:
      - { es: café, ipa: "kaˈfɛ", tip: open é }
      - { es: você, ipa: "voˈse", tip: closed ê }
      - { es: avó, ipa: "aˈvɔ", tip: "grandmother: open ó" }
      - { es: avô, ipa: "aˈvo", tip: "grandfather: closed ô" }
      - { es: bolo, ipa: "ˈbo.lu", tip: final o sounds like u }
      - { es: leite, ipa: "ˈlej.tʃi", tip: final e sounds like i }
      - { es: casa, ipa: "ˈka.zɐ", tip: weak final a }
    minimalPairs: [[avó, avô], [céu, seu], [pôde, pode], [nós, nos], [só, sou]]
    practice: ["A avó e o avô tomam café.", "Você quer bolo de chocolate?", "O céu está azul hoje.", "Ele pôde vir ontem, mas hoje não pode.", "Nós somos do Rio."]
  - id: ph.nasals
    title: Nasal vowels and diphthongs
    explanation: |
      Nasal vowels are the signature sound of Portuguese: air goes through the nose **and** the mouth, and there is no full n or m at the end. A vowel is nasal when it carries a **til** (˜): *lã*, *mão*; or when it is followed by **m** or **n** in the same syllable: *campo*, *sim*, *bom*, *um*.

      The nasal diphthongs are the hardest and the most frequent:
      - **ão** /ɐ̃w̃/: *mão*, *pão*, *não*, *São Paulo*. Also final **-am** in verbs: *falam* /ˈfa.lɐ̃w̃/.
      - **ãe** /ɐ̃j̃/: *mãe*, *pães*.
      - **õe** /õj̃/: *limões*, *põe*.
      - final **-em** /ẽj̃/: *bem*, *também*, *tem*, *viagem*.

      ### Tips
      - Do not close your lips on a final m: *sim* is /sĩ/, never "simm".
      - *muito* is pronounced with a nasal ui, /ˈmũj̃.tu/, although there is no m or n next to it.
      - Practise *pão* by saying "pow" while letting air escape through your nose.
    items:
      - { es: mão, ipa: "ˈmɐ̃w̃" }
      - { es: mãe, ipa: "ˈmɐ̃j̃" }
      - { es: limões, ipa: "liˈmõj̃s" }
      - { es: bem, ipa: "ˈbẽj̃", tip: no final m sound }
      - { es: sim, ipa: "ˈsĩ" }
      - { es: campo, ipa: "ˈkɐ̃.pu", tip: m only nasalises the a }
      - { es: muito, ipa: "ˈmũj̃.tu", tip: nasal without m or n }
    minimalPairs: [[pão, pau], [mão, mau], [lã, lá], [vim, vi], [som, só]]
    practice: ["Minha mãe come pão com manteiga.", "Não, não, não!", "Também tem limões?", "São Paulo é uma cidade grande.", "Eles falam bem alemão."]
  - id: ph.r
    title: R and RR, from Rio to Lisbon
    explanation: |
      Portuguese has two r sounds, and the difference changes meaning: *caro* (expensive) vs *carro* (car).

      - **Weak r**: a single **r** between vowels or after a consonant is a quick tap /ɾ/, like the "tt" in American "butter": *caro*, *Brasil*, *prato*.
      - **Strong r**: **rr**, and **r** at the start of a word or after *n, l, s*, is a sound made in the throat. In most of Brazil it is like the English **h** in "hat" /h/ or a rougher /x/: *Rio* sounds "HEE-oo", *carro* "KA-hoo". In Portugal it is usually a uvular /ʁ/, like French r.
      - **r at the end of a syllable** varies the most: an h-sound in Rio and much of Brazil (*porta*, *mar*), a tap in São Paulo city, a retroflex "American" r in the countryside of São Paulo and Minas (*porta* "PORR-ta"). At the end of verbs it often disappears in relaxed speech: *falar* → "fa-LÁ".

      ### Tips
      - Remember that the letter **h** is always silent, but the strong **r** often sounds like an English h: *rato* ≈ "HA-too".
      - *honra* and *Israel*: r after n or s is strong.
    items:
      - { es: caro, ipa: "ˈka.ɾu", tip: tap }
      - { es: carro, ipa: "ˈka.hu", tip: strong r like English h }
      - { es: Rio, ipa: "ˈhi.u", tip: initial r is strong }
      - { es: rua, ipa: "ˈhu.ɐ" }
      - { es: honra, ipa: "ˈõ.hɐ", tip: "silent h, strong r after n" }
      - { es: porta, ipa: "ˈpɔh.tɐ", tip: "Rio: h-sound; São Paulo: tap" }
      - { es: prato, ipa: "ˈpɾa.tu", tip: tap after a consonant }
    minimalPairs: [[caro, carro], [era, erra], [muro, murro], [fora, forra], [coro, corro]]
    practice: ["O carro do Roberto é caro.", "Eu moro no Rio de Janeiro.", "O rato roeu a roupa do rei de Roma.", "Quero um prato de arroz.", "A porta está aberta."]
  - id: ph.t-d
    title: T and D before an i sound
    explanation: |
      In most of Brazil, **t** and **d** change before an **i** sound: **t** becomes /tʃ/ ("ch" in "cheese") and **d** becomes /dʒ/ ("j" in "jeans"). Remember that unstressed final **-e** also sounds /i/, so it triggers the change too:

      | Written | Sounds like |
      |---|---|
      | *tia* | "CHEE-a" |
      | *dia* | "JEE-a" |
      | *leite* | "LAY-chee" |
      | *cidade* | "see-DAH-jee" |
      | *tarde* | "TAR-jee" |

      Before other vowels t and d stay as they are: *tudo*, *dado*, *todo*.

      ### Variants
      In Portugal and in parts of the Brazilian Northeast (Recife, for example) t and d do **not** change: *dia* is "DEE-a" and *leite* "LAY-tuh". Both are correct; this course uses the majority Brazilian pronunciation.
    items:
      - { es: tia, ipa: "ˈtʃi.ɐ" }
      - { es: dia, ipa: "ˈdʒi.ɐ" }
      - { es: leite, ipa: "ˈlej.tʃi", tip: final e sounds i and triggers ch }
      - { es: cidade, ipa: "siˈda.dʒi", tip: "first d normal, second d like j" }
      - { es: noite, ipa: "ˈnoj.tʃi" }
      - { es: tudo, ipa: "ˈtu.du", tip: no change before u }
    minimalPairs: [[parte, parto], [ponte, ponto], [leite, leito], [cante, canto], [mude, mudo]]
    practice: ["Bom dia, tia!", "Boa tarde, boa noite.", "A cidade é grande e diferente.", "Tudo bem? Tudo ótimo!", "Eu tomo leite quente de noite."]
  - id: ph.s-z-x
    title: S, Z, Ç and the four sounds of X
    explanation: |
      - **s** at the start of a word, **ss**, **ç** and **c** before e/i are /s/: *sapo*, *passo*, *caça*, *cinema*.
      - **s** between vowels and **z** are /z/: *casa*, *azul*, *zero*. So *casa* (house) and *caça* (hunt) are different words.
      - **s** or **z** at the end of a syllable is /s/ in São Paulo and most of Brazil, but /ʃ/ ("sh") in Rio de Janeiro and in Portugal: *festa* "FESH-ta", *mais* "MAISH". Before a voiced consonant it becomes /z/ or /ʒ/: *mesmo*.
      - **ch** and **x** are usually /ʃ/: *chá*, *xícara*, *caixa*. **j**, and **g** before e/i, are /ʒ/ ("s" in "pleasure"): *já*, *gente*.

      ### The letter x
      It has four sounds, and you learn them word by word: /ʃ/ in *xícara*, *caixa*; /ks/ in *táxi*, *tóxico*; /s/ in *próximo*, *máximo*; /z/ in *exame*, *exemplo* (ex- + vowel).
    items:
      - { es: casa, ipa: "ˈka.zɐ", tip: s between vowels is z }
      - { es: caça, ipa: "ˈka.sɐ" }
      - { es: festa, ipa: "ˈfɛs.tɐ", tip: "Rio and Portugal: ˈfɛʃ.tɐ" }
      - { es: xícara, ipa: "ˈʃi.ka.ɾɐ" }
      - { es: táxi, ipa: "ˈtak.si" }
      - { es: próximo, ipa: "ˈpɾɔ.si.mu" }
      - { es: exame, ipa: "eˈzɐ̃.mi" }
    minimalPairs: [[casa, caça], [asa, assa], [rosa, roça], [chá, já], [zelo, selo]]
    practice: ["A casa azul fica na próxima rua.", "Uma xícara de chá, por favor.", "O táxi chega às seis.", "Mais duas cervejas, por favor!", "Já fiz o exame."]
  - id: ph.lh-nh
    title: LH and NH
    explanation: |
      Two digraphs stand for single sounds made with the middle of the tongue pressed against the roof of the mouth:

      - **nh** /ɲ/ is like the "ny" in "canyon" said as one sound (Spanish ñ): *vinho*, *banho*, *amanhã*.
      - **lh** /ʎ/ is like the "lli" in "million" said as one sound: *filho*, *trabalho*, *mulher*. Many Brazilians soften it towards a "y" sound in casual speech.

      They change meaning: *filho* (son) vs *filo* (phylum), *vela* (candle) vs *velha* (old woman), *sono* (sleep) vs *sonho* (dream).

      ### Tips
      - Do not split lh into an l plus an h: there is no h sound at all.
      - Keep the tongue tip down behind your lower teeth and lift the middle of the tongue.
    items:
      - { es: filho, ipa: "ˈfi.ʎu" }
      - { es: mulher, ipa: "muˈʎɛh" }
      - { es: trabalho, ipa: "tɾaˈba.ʎu" }
      - { es: vinho, ipa: "ˈvi.ɲu" }
      - { es: amanhã, ipa: "a.mɐˈɲɐ̃" }
      - { es: banho, ipa: "ˈbɐ̃.ɲu", tip: the vowel before nh is nasal }
    minimalPairs: [[filho, filo], [vela, velha], [mola, molha], [sono, sonho], [pena, penha]]
    practice: ["Meu filho trabalha muito.", "Amanhã vamos tomar vinho.", "A velha acende uma vela.", "Tive um sonho e perdi o sono.", "A mulher olha a janela."]
  - id: ph.final-l
    title: The L that turns into U
    explanation: |
      In Brazil, **l at the end of a syllable** is pronounced like a **u** /w/: *Brasil* "bra-ZEEW", *sol* "SOW", *azul* "a-ZOOW", *alto* "OW-too". At the start of a syllable it is a clear l: *lua*, *bola*.

      This creates many homophones in Brazil: *mal* (badly) and *mau* (bad) sound identical, as do *alto* (tall) and *auto* (car), *calda* (syrup) and *cauda* (tail). Spelling them correctly is a classic challenge even for native speakers.

      ### In Portugal
      European Portuguese keeps a "dark" l, like the English l in "ball": *Brasil* /bɾɐˈziɫ/, *Portugal* /puɾtuˈɣaɫ/. There, *mal* and *mau* are different.
    items:
      - { es: Brasil, ipa: "bɾaˈziw" }
      - { es: sol, ipa: "ˈsɔw" }
      - { es: azul, ipa: "aˈzuw" }
      - { es: papel, ipa: "paˈpɛw" }
      - { es: alto, ipa: "ˈaw.tu" }
      - { es: Portugal, ipa: "pohtuˈɡaw", tip: "Portugal: puɾtuˈɣaɫ, with a dark l" }
    minimalPairs: [[mal, mau], [alto, auto], [calda, cauda], [vil, viu]]
    practice: ["O Brasil é um país tropical.", "O céu está azul e o sol está quente.", "Isso não é mau, é muito legal!", "Preciso de papel e de um lápis.", "O hotel é legal e o pessoal é gentil."]
  - id: ph.stress
    title: Stress and written accents
    explanation: |
      Every Portuguese word has one stressed syllable. Without a written accent:

      1. Words ending in **a, e, o** (plus *s*), **am, em, ens** are stressed on the **second-to-last** syllable: *ca-sa*, *fa-lam*, *jo-vem*.
      2. Words ending in **i, u** (plus *s*), **l, r, z, x, im, um, om** and nasal **ã, ão** are stressed on the **last** syllable: *a-qui*, *Bra-sil*, *fa-lar*, *ra-paz*, *ir-mã*, *a-vi-ão*.

      A written accent marks every exception, and also shows the vowel quality:
      - **acute ´** = stressed and open: *café*, *avó*, *fácil*, *música*.
      - **circumflex ^** = stressed and closed: *você*, *avô*, *ônibus*, *português*.
      - **til ˜** marks nasality; it usually also falls on the stressed syllable: *irmã*, *mãe*, *coração*. But not always: *órfão*, *bênção*.
      - **grave `** appears only on *à*, *às*, *àquele*: the contraction of the preposition *a* with *a* (crase), not stress.

      Words stressed on the third-from-last syllable always carry an accent: *pássaro*, *ônibus*, *lâmpada*.

      ### European Portuguese
      Before m or n, Portugal often writes an acute where Brazil writes a circumflex: *econômico* / *económico*, *gênero* / *género*, *bebê* / *bebé*, *tênis* / *ténis*.
    items:
      - { es: café, tip: "ends in a vowel but stressed on the last syllable → accent" }
      - { es: fácil, tip: "ends in l but stressed on the second-to-last → accent" }
      - { es: ônibus, tip: "stressed third from last → always an accent" }
      - { es: açúcar, tip: "ends in r but stressed on the second-to-last → accent" }
      - { es: falar, tip: "ends in r, stressed on the last syllable → no accent needed" }
      - { es: país, tip: "stressed i after a vowel → accent breaks the diphthong" }
      - { es: à, tip: "grave accent = a + a contraction, not stress" }
    minimalPairs: [[sábia, sabiá], [secretária, secretaria], [pais, país], [baba, babá], [esta, está]]
    practice: ["O sabiá canta e a sábia escuta.", "Meus pais moram em outro país.", "A secretária está na secretaria.", "Vamos à praia de ônibus.", "Esta casa está vazia."]
  - id: ph.european
    title: European Portuguese
    explanation: |
      The final region of the journey is Portugal. The spelling is almost the same, but the sound is very different, and Brazilians and Portuguese sometimes find each other hard to follow at first.

      - **Vowel reduction**: unstressed vowels shrink or vanish. Unstressed **e** becomes a very short /ɨ/ or disappears: *telefone* ≈ "t'l'FON", *pequeno* ≈ "p'KEH-noo". Unstressed **o** is /u/ and unstressed **a** is /ɐ/. The rhythm is stress-timed, closer to English or Russian than to Brazilian.
      - **t and d** never change before i: *dia* "DEE-a", *noite* "NOY-t'".
      - **s and z** at the end of a syllable are "sh" /ʃ/ or "zh" /ʒ/: *portugueses*, *mesmo* "MEZH-moo".
      - **ei** is often /ɐj/: *leite* ≈ "LAY-t'" with a darker vowel.
      - **l** at the end of a syllable stays a dark l: *Portugal*, *mal*.
      - **b, d, g** between vowels soften, as in Spanish: *obrigado* /ɔ.bɾiˈɣa.ðu/.

      ### Grammar you will hear
      *tu* with its own verb forms for friends (*tu queres?*), *estar a* + infinitive for actions in progress (*estou a comer* = *estou comendo*), pronouns after the verb (*chamo-me Ana*), and different everyday words: *autocarro*, *comboio*, *pequeno-almoço*, *telemóvel*.
    items:
      - { es: telefone, ipa: "tɨ.lɨˈfɔn", tip: unstressed e almost disappears }
      - { es: pequeno, ipa: "pɨˈke.nu" }
      - { es: obrigado, ipa: "ɔ.bɾiˈɣa.ðu", tip: soft g and d }
      - { es: leite, ipa: "ˈlɐj.tɨ", tip: no ch sound }
      - { es: mesmo, ipa: "ˈmeʒ.mu" }
      - { es: Portugal, ipa: "puɾ.tuˈɣaɫ", tip: dark l }
    minimalPairs: []
    practice: ["Estou a tomar o pequeno-almoço.", "O autocarro para Lisboa sai às dez.", "Chamo-me Joana e sou do Porto.", "Tu queres um pastel de nata?", "Obrigado, até amanhã!"]
  - id: ph.linking
    title: Rhythm, linking and intonation
    explanation: |
      Brazilian Portuguese flows smoothly: words link into each other and the vowels stay fairly full.

      - A final **s** before a vowel links as /z/: *os amigos* → "u-za-MEE-goos".
      - Two vowels across words merge: *de água* → "DJA-gwa", *que é* → "KYEH".
      - Consonant clusters that Portuguese does not like get an extra **i** sound: *advogado* "a-dji-vo-GA-doo", *pneu* "pi-NEW", *futebol* in casual speech "fu-chi-BOW".
      - Everyday speech shortens common words: *está* → *tá*, *para* → *pra*, *você* → *cê*.

      ### Intonation
      - Statements fall at the end.
      - Yes/no questions keep the same word order and **rise** at the end: *Você vem?* ↗
      - Questions with a question word (*onde*, *quando*, *o que*) usually **fall**: *Onde você mora?* ↘
      - Brazilians often add *né?* (= *não é?*) to check agreement: *Tá calor, né?*
    items:
      - { es: os amigos, ipa: "u.zaˈmi.ɡus", tip: link the s as z }
      - { es: advogado, ipa: "a.dʒi.voˈɡa.du", tip: extra i sound }
      - { es: pneu, ipa: "piˈnew" }
      - { es: Tá bom., tip: "short for está bom" }
      - { es: Você vem?, tip: "rising" }
      - { es: Onde você mora?, tip: "falling" }
    minimalPairs: []
    practice: ["Os amigos da Ana estão aqui.", "Você vem pra festa hoje?", "Onde fica o hotel?", "Tá calor, né?", "O que você quer?"]
